    input.left = input.right = input.up = input.down = false;
    input.punch = input.kick = input.jump = false;
  }
  input.punchP = input.kickP = input.jumpP = false;
  prevInput = { left:false, right:false, up:false, down:false, punch:false, kick:false, jump:false };
  if (pins[1]){
    pins[1].lv = { up:false, down:false, left:false, right:false, punch:false, kick:false, jump:false };
    pins[1].buf = { punch: 0, kick: 0, jump: 0 };
    pins[1].edge = { punchP:false, kickP:false, jumpP:false };

function defaultCfg(o){

  // Returns the final snapshot. Fixed-step only — no wall clock involved.
  runScript: function(seed, script, opts){

    // must not inherit edge buffers / direction levels armed by real input;
    // reset them so replays are bit-identical (fresh-load semantics).

    return this.snapshot();
  },
  start: function(seed, opts){ fixedSeed = (seed === undefined ? fixedSeed : seed); G = newGame(fixedSeed, defaultCfg(opts)); G.phase = "fight"; startWave(0);
    resetInputState(true); },
  // start at the character-select screen (for UI tests)
  toSelect: function(seed){ fixedSeed = (seed === undefined ? fixedSeed : seed); G = newGame(fixedSeed, {}); G.phase = "select"; selIdx = 0; selApply(); resetInputState(true); },
  selectSet: function(i){ selIdx = i; selApply(); },
  get selIdx(){ return selIdx; },
  // online session introspection (lobby flow + net test rig)
  get net(){ return NET ? { active: NET.active, role: NET.role, myIdx: NET.myIdx, code: NET.code,
    seed: NET.seed, stalled: NET.stalled, desync: NET.desync, broken: NET.broken,
    dropped: NET.dropped, live: NET.live, attempts: NET.attempts, pingMs: NET.pingMs,
    mode: NET.mode, sid: NET.sid, menu: netMenu.open,
    nextTick: NET.nextTick, have0: Object.keys(NET.recs[0]).length,
    have1: Object.keys(NET.recs[1]).length } : null; },
  // network-resilience test hooks
  netDrop: function(){ if (NET && NET.active) netHandleDrop(NET, "test drop"); },
  netSnapshot: function(){ return (NET && NET.active) ? netSerializeState() : null; },
  netRestore: function(json){
    if (!NET || !NET.active) return false;
    try { G = netRestoreState(json); netResetAfterResume(NET, G.tick); return true; }
    catch(e){ return false; }
  },
  netDisconnect: function(){ netDisconnect("已斷線"); },
  netForceReconnect: function(){ netForceReconnect(); },
  fitCanvas: function(){ fitCanvas(); },
  get view(){ return { W:W, H:H, RS:RS, scale:VIEW_SCALE, safe:SAFE, cvW:cv.width, cvH:cv.height }; },
  lobbyInfo: function(){ return { phase: G.phase, state: LOBBY.state, idx: LOBBY.idx,
    code: LOBBY.code, typed: LOBBY.typed, status: LOBBY.status, selIdx: selIdx }; },
  forceWave: function(n){ G.enemies = []; G.bossRef = null; startWave(n); },
  hurtPlayer: function(n, idx){ var q = G.players[idx || 0]; q.hp -= n; if (q.hp <= 0 && !q.dead){ q.dead = true; q.state = "down"; q.tState = 0; q.vy = 200; } },
  killPlayer: function(idx){ var q = G.players[idx || 0]; q.hp = 0; q.dead = true; q.state = "down"; q.tState = 0.9; q.removeMe = false; },
  spawnBoss: function(){ G.enemies = []; G.bossRef = null; startWave(3); },
  killAll: function(){ for (var i=0;i<G.enemies.length;i++){ G.enemies[i].hp = 0; G.enemies[i].dead = true; G.enemies[i].state = "down"; G.enemies[i].tState = 0.79; G.enemies[i].vy = 1; G.enemies[i].y = 0.01; } },
  giveWeapon: function(t, idx){ G.players[idx || 0].weapon = { type: t || "bat", dur: 8 }; },
  setInput: function(o, idx){ pinForTest(idx || 0).set(o); },
  botStep: function(idx, mode){
    // legacy: one interleaved sim step driven by the shared botDrive logic
    // (P1 only; mode "stand" parks the bot)
    if ((idx || 0) === 0 && mode !== "stand") botDrive();
    else if (mode === "stand") pinForTest(idx || 0).set({ up:false, down:false, left:false, right:false });
    simStep(STEP);
    input.startP = false;
  },
  stepTicks: function(n){ for (var i=0;i<n;i++){ simStep(STEP); input.startP = false; } },
  useBot: function(on){ botOn = !!on; },
  // deterministic wave-1 bot run (same logic the browser build uses via
  // botDrive): returns the snapshot when wave 1 ends (cleared or died).
  botWave1: function(seed, opts){
    fixedSeed = seed;
    G = newGame(seed, defaultCfg(opts)); G.phase = "fight"; startWave(0);
    resetInputState();
    var guard = 0;
    while (guard++ < 60 * 120){
      if (G.phase === "go" || G.phase === "over" || G.wave > 0) break;
      botDrive();
      simStep(STEP); input.startP = false;
    }
    var snap = this.snapshot();
    resetInputState();
    return snap;
  },
  snapshot: function(){
    var ps = [];
    for (var i=0;i<G.players.length;i++){
      var q = G.players[i];
      ps.push({ hp: q.hp, x: Math.round(q.x), z: Math.round(q.z), state: q.state,
        charId: q.charId, kind: q.kind, alive: !q.dead,
        weapon: q.weapon ? q.weapon.type : null });
    }
    return {
      phase: G.phase, wave: G.wave, score: G.score,
      mode: G.mode, players: ps,
      playerHp: ps[0].hp, playerX: ps[0].x, playerZ: ps[0].z,
      playerState: ps[0].state, weapon: ps[0].weapon,
      enemiesAlive: G.enemies.filter(function(e){ return !e.removeMe; }).length,
      propsLeft: G.props.filter(function(pr){ return !pr.dead; }).length,
      foodOut: G.parts.filter(function(q2){ return q2.food; }).length,
      cam: Math.round(G.cam), tick: G.tick, time: Math.round(G.time * 10) / 10,
      bossHp: G.bossRef ? G.bossRef.hp : null
    };
  }
};
</script>
