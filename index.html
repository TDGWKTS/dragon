<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets us draw into the safe area on notched phones;
     minimum-scale + user-scalable=no stop iOS from zooming on double taps. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05050a">
<meta name="format-detection" content="telephone=no">
<title>雙龍巷戰 Dragon Alley</title>
<link rel="icon" href="data:,">
<style>
  :root { --safe-l:env(safe-area-inset-left, 0px); --safe-r:env(safe-area-inset-right, 0px);
          --safe-t:env(safe-area-inset-top, 0px); --safe-b:env(safe-area-inset-bottom, 0px); }
  html, body { margin:0; padding:0; background:#05050a; width:100%; height:100%;
    height:100dvh; overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%; touch-action:none; overscroll-behavior:none;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 45%, #0d1024 0%, #05050a 78%);
    padding-left:var(--safe-l); padding-right:var(--safe-r);
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    box-sizing:border-box; touch-action:none; overscroll-behavior:none; }
  /* High-resolution backing store: the game draws in 480x270 logical units
     but at 2-3x internal resolution, so shapes stay crisp on DPR 2-3 phones. */
  canvas { display:block; background:#000; touch-action:none; image-rendering:auto;
    box-shadow:0 0 36px rgba(0,0,0,0.9); }
  #hint { position:fixed; left:0; right:0; bottom:2px; text-align:center; color:#556;
    font-size:11px; pointer-events:none; }
  @media (pointer:coarse) { #hint { display:none; } }
  /* Portrait prompt: the game is built for landscape. Backdrop is
     non-blocking so a determined player can still dismiss and play. */
  #rotate { position:fixed; inset:0; z-index:20; display:none; align-items:center;
    justify-content:center; flex-direction:column; gap:18px; text-align:center;
    background:rgba(5,5,12,0.93); color:#e9e3cf; pointer-events:none;
    padding:24px; box-sizing:border-box; }
  #rotate .ico { font-size:54px; line-height:1; color:#ffd94a; animation:tilt 1.8s ease-in-out infinite; }
  #rotate h2 { margin:0; font-size:21px; letter-spacing:2px; }
  #rotate p { margin:0; font-size:13px; color:#9aa; line-height:1.7; }
  #rotate button { pointer-events:auto; margin-top:6px; padding:10px 22px; font-size:14px;
    color:#ffe9a8; background:rgba(255,217,74,0.12); border:1px solid rgba(255,217,74,0.5);
    border-radius:22px; -webkit-appearance:none; }
  @keyframes tilt { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-90deg)} }
  body.need-rotate #rotate { display:flex; }
  #safe-probe { position:fixed; width:0; height:0; opacity:0; pointer-events:none;
    padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px);
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="480" height="270"></canvas></div>
<div id="safe-probe"></div>
<div id="rotate">
  <div class="ico">▭</div>
  <h2>請打橫手機玩</h2>
  <p>Rotate to landscape for the full arcade view<br>橫向畫面先至放到晒拳／腳／跳掣</p>
  <button id="rotate-skip" type="button">照樣直向玩</button>
</div>
<div id="hint">鍵盤：方向鍵/WASD 移動 · J 拳/執武器 · K 腳 · L/空白 跳 · P 暫停 · N 連線選單 · 2P：TFGH 行 / R 拳 / Y 腳 / U 跳 · 跑動跳踢：方向＋跳＋腳</div>

<script>
"use strict";
/* ============================================================
   雙龍巷戰 DRAGON ALLEY — original belt-scroll beat-'em-up
   Single-file, vanilla JS, Canvas 2D. Deterministic fixed-step
   sim (60 Hz) with seeded PRNG — lockstep-ready architecture.
   ============================================================ */

// ---------- deterministic PRNG (mulberry32) ----------
function RNG(seed){ this.s = seed >>> 0; }
RNG.prototype.next = function(){
  this.s = (this.s + 0x6D2B79F5) >>> 0;

// ---------- constants ----------
var W = 480, H = 270;

var WORLD_LEN = 2600;                          // total stage length (px)

// Every game coordinate below is LOGICAL; RS is the backing-store multiplier

var BASE_W = 480, BASE_H = 270, W_MAX = 600, W_MIN = 480;
var RS = 1, VIEW_SCALE = 1;
var SAFE = { l:0, r:0, t:0, b:0 };   // safe-area insets, in logical units
var PORTRAIT_HINT = true, ROTATE_DISMISSED = false;

// input state: produced by keyboard/touch, consumed by sim.
// punchP/kickP/jumpP are DERIVED each sim step from edgeBuf (see simStep):
// a fresh press arms a buffer of BUF_TICKS steps; the sim consumes it once.
// This keeps presses from being dropped during hitstop / attack / dash.
var input = { up:false, down:false, left:false, right:false,
              punch:false, kick:false, jump:false,
              punchP:false, kickP:false, jumpP:false, startP:false };
var prevInput = { punch:false, kick:false, jump:false, start:false,
                  left:false, right:false, up:false, down:false };
var BUF_TICKS = 18;   // ~0.3 s at 60 Hz
var edgeBuf = { punch: 0, kick: 0, jump: 0 };
function pressEdge(kind){ edgeBuf[kind] = BUF_TICKS; }

// ---------- online play (v4) ----------
// Lockstep over a message transport (PeerJS cloud by default; a
// BroadcastChannel loopback when the URL has ?nettest=1, for testing).
// INPUT_DELAY: a local input sampled now is stamped for tick now+DELAY, so
// both peers have time to hold both records before stepping that tick.
var INPUT_DELAY = 3;
// Query flags, read defensively: the node test harness loads this script
// with no location object, and local modes must never depend on them.
var QS_NETTEST = false, QS_ROLE = "", QS_RELAY = "";
try {
  if (typeof location !== "undefined" && location.search){
    QS_NETTEST = /[?&]nettest=1(&|$)/.test(location.search);
    var qsRoleM = /[?&]role=(host|guest)/.exec(location.search);
    if (qsRoleM) QS_ROLE = qsRoleM[1];
    // ?relay=wss://... points the game at a Cloudflare relay worker and
    // is remembered on this device, so the link only needs opening once.
    var qsRelayM = /[?&]relay=([^&]+)/.exec(location.search);
    if (qsRelayM){
      QS_RELAY = decodeURIComponent(qsRelayM[1]);
      try { localStorage.setItem("da-relay-url", QS_RELAY); } catch(e){}
    }
  }
} catch(e){}

// ---------- audio (WebAudio synth, starts on first gesture) ----------
var AC = null, muted = false, bgmOn = false, bgmStep = 0, bgmNext = 0;
function audioInit(){

}

  punch:  function(){ noiseBurst(0.09, 0.28, 700); beep(140, 0.08, "square", 0.15, 60); },
  kick:   function(){ noiseBurst(0.10, 0.30, 500); beep(110, 0.10, "square", 0.16, 50); },
  jumpkick: function(){ noiseBurst(0.16, 0.24, 2600); beep(520, 0.16, "sawtooth", 0.12, 120);
                        setTimeout(function(){ noiseBurst(0.11, 0.30, 420); beep(100, 0.11, "square", 0.16, 45); }, 90); },
  hurt:   function(){ beep(220, 0.10, "sawtooth", 0.12, 110); },
  down:   function(){ noiseBurst(0.16, 0.30, 300); beep(90, 0.16, "square", 0.18, 40); },
  pickup: function(){ beep(660, 0.07, "square", 0.12); setTimeout(function(){ beep(990, 0.09, "square", 0.12); }, 60); },
  crack:  function(){ noiseBurst(0.06, 0.30, 3200); beep(1800, 0.05, "square", 0.08, 900); },
  go:     function(){ beep(523,0.09,"square",0.12); setTimeout(function(){beep(784,0.12,"square",0.12);},90); },
  clear:  function(){ var n=[523,659,784,1047]; for (var i=0;i<4;i++)(function(i){ setTimeout(function(){ beep(n[i],0.16,"square",0.13); }, i*120); })(i); },
  over:   function(){ var n=[392,330,262,196]; for (var i=0;i<4;i++)(function(i){ setTimeout(function(){ beep(n[i],0.2,"triangle",0.14); }, i*160); })(i); }
};

var LEAD = [220,0,262,220, 0,196,0,0, 175,0,196,175, 0,165,0,0,
            220,0,262,220, 0,294,262,0, 247,0,220,0, 196,0,0,0];

  if (!AC || muted || !bgmOn) return;
  var now = AC.currentTime;
  while (bgmNext < now + 0.12){
    var s = bgmStep % 32, dt = Math.max(0, bgmNext - now);

        var l = LEAD[step]; if (l) beep(l, 0.11, "square", 0.05);

  }
}

// ---------- characters ----------
var HEROES = {
  ahLong: { name: "阿龍", kind: "hero",  speedMul: 1.00, dmgMul: 1.00, comboMul: 1.00 },
  ahFu:   { name: "阿虎", kind: "hero2", speedMul: 1.14, dmgMul: 0.85, comboMul: 0.82 }
};
var HERO_BY_KIND = { hero: "ahLong", hero2: "ahFu" };

// ---------- game state ----------
var G = null;
function newGame(seed, cfg){
  cfg = cfg || {};
  var mode = cfg.mode || "1P";
  var chars = cfg.chars || ["ahLong"];
  var g = {
    rng: new RNG(seed),
    phase: "title",        // title | select | fight | go | clear | over
    tick: 0, time: 0,
    cam: 0, camTarget: 0,
    wave: 0,               // 0..3 (3 = boss)
    gate: 300,             // world x where current gate sits
    score: 0,
    shake: 0, hitstop: 0,
    goTimer: 0, clearTimer: 0,
    mode: mode,
    players: [], enemies: [], weapons: [], parts: [], floats: [], props: [],
    bossRef: null,
    selMode: "1P", selChar: 0, atkTokens: 1,
    msg: ""
  };
  g.players.push(makePlayer(0, chars[0] || "ahLong", 80, 215));
  if (mode === "2P") g.players.push(makePlayer(1, chars[1] || "ahFu", 46, 232));
  g.player = g.players[0];   // legacy single-player alias
  return g;
}
function makePlayer(idx, charId, x, z){
  var hc = HEROES[charId];
  var p = makeFighter(hc.kind, x, z);
  p.idx = idx; p.charId = charId;
  p.hp = 100; p.maxhp = 100;
  p.speed = Math.round(TYPES.hero.speed * hc.speedMul);
  return p;
}

// ---------- fighters ----------
var TYPES = {
  hero:   { hp:100, speed:105, w:16, h:40, dmg:1 },
  hero2:  { hp:100, speed:105, w:16, h:40, dmg:1 },
  brawler:{ hp:30,  speed:52,  w:16, h:38, dmg:6 },
  carrier:{ hp:24,  speed:62,  w:15, h:38, dmg:5 },
  brute:  { hp:80,  speed:36,  w:22, h:46, dmg:10 },
  boss:   { hp:260, speed:44,  w:26, h:52, dmg:12 }
};

  var t = TYPES[kind];
  return {
    kind: kind, x: x, z: z, y: 0, vy: 0, face: 1,
    hp: t.hp, maxhp: t.hp, speed: t.speed, w: t.w, h: t.h, dmg: t.dmg,
    state: "idle", tState: 0, atkT: 0, combo: 0, comboWin: 0,

  if (G.mode === "2P") e.hp = e.maxhp = Math.round(e.maxhp * 1.25);

  return e;
}
var WAVES = [
  { gate: 760,  list: [["brawler", 840, 205, null], ["brawler", 900, 235, null], ["carrier", 960, 215, "bat"]] },
  { gate: 1420, list: [["brawler", 1520, 225, null], ["carrier", 1580, 200, "knife"], ["brawler", 1640, 240, null], ["carrier", 1700, 215, "whip"]] },
  { gate: 2050, list: [["brute", 2160, 220, null], ["brawler", 2240, 200, null], ["brawler", 2300, 240, null], ["carrier", 2360, 215, "knife"]] },
  { gate: 2560, list: [["boss", 2450, 218, null], ["brawler", 2360, 240, null]] }
];
// per-wave pacing: how many enemies may be winding up / attacking at once
var WAVE_TOKENS = [1, 2, 2, 99];
function startWave(n){
  G.wave = n;
  var wv = WAVES[n];
  G.gate = wv.gate;
  G.atkTokens = WAVE_TOKENS[n];
  for (var i=0;i<wv.list.length;i++){
    var s = wv.list[i];
    var e = spawnEnemy(s[0], s[1], s[2], s[3]);
    if (G.wave === 0 && s[0] !== "boss") e.dmg = Math.max(3, e.dmg - 2); // wave-1 onboarding: softer hits
    if (s[0] === "boss") G.bossRef = e;

  if (G.mode === "2P"){
    var extra = [["brawler", wv.gate - 80, 232], ["carrier", wv.gate - 40, 200],

    var ex = spawnEnemy(extra[0], extra[1], extra[2], null);
    if (G.wave === 0) ex.dmg = Math.max(3, ex.dmg - 2);

var FOOD_TYPES = ["燒賣", "叉燒包"];
// pre-placed per gate in stage data: deterministic (no runtime RNG for placement)
var PROPS_PER_WAVE = [
  [ { x: 350, z: 196, t: "crate" }, { x: 560, z: 240, t: "crate" } ],                                 // wave 1 gates

// ---------- combat helpers ----------

// ---------- player update ----------

var NET = null;

function getPin(p){

  if (p.idx === 0) return { lv: input, buf: edgeBuf, edge: input };
  if (!pins[1]) pins[1] = { lv: { up:false, down:false, left:false, right:false, punch:false, kick:false, jump:false }, buf: { punch:0, kick:0, jump:0 }, edge: { punchP:false, kickP:false, jumpP:false } };
  return pins[1];
}
function pinForTest(idx){
  var pin = (idx === 1) ? getPin({ idx: 1 })
                        : { lv: input, buf: edgeBuf, edge: input };
  return {
    set: function(o){ for (var k in o){
      if (k === "punchP" || k === "kickP" || k === "jumpP"){
        var kind = k.slice(0, -1);
        if (o[k]) pin.buf[kind] = BUF_TICKS; else pin.buf[kind] = 0;
      } else pin.lv[k] = o[k];

function playerStep(p, dt){
  var pin = getPin(p), IN = pin.lv, EB = pin.buf, ED = pin.edge;

    p.x += p.vx * dt; p.vx *= 0.86;
    if (p.y <= 0 && p.vy < 0){ p.y = 0; p.vy = -p.vy * 0.35; if (Math.abs(p.vy) < 60){ p.vy = 0; } }
    if (p.tState > 0.85){
      if (p.dead){
        // co-op: stay down until the gate changes (respawn handled in simStep)
        if (!(G.mode === "2P" && otherAlive(p))) p.removeMe = true;
      }
      else { p.state = "idle"; p.tState = 0; p.invuln = 0.5; }
    }
    return;
  }

    p.x += p.vx * dt; p.z += p.vz * dt;

    // foot button a beat AFTER take-off still converts the jump into a kick.
    if (p.y > 6 && p.state === "jump" && ED.kickP && amx !== 0){

    // so it can connect with grounded enemies from well above them

      var jd = Math.max(1, Math.round(11 * (HEROES[p.charId] || HEROES.ahLong).dmgMul));
      if (doAttackHit(p, 30, 15, jd, p.face * 330, true)){
        p.hitDone = true;
        G.score += 40;
        G.shake = Math.max(G.shake, 3);

      }
    }
    if (p.y <= 0){

      p.state = landedKick ? "attack" : "idle";
      p.tState = 0;
      if (landedKick){
        p.atkKind = "jumpkick"; p.vx = 0;
        spawnDust(p.x, p.z, 7); G.shake = Math.max(G.shake, 2);
      } else spawnDust(p.x, p.z, 3);
      if (p.state === "jumpatk") p.state = "idle";
    }

  }

      EB.kick = 0;

      gt.grabbedBy = null; p.grabTarget = null; p.state = "idle"; p.combo = 0;
      G.score += 50; SFX.kick();

  // Both press edges arrive on the same lockstep input record (or within the

function tapDir(d, p){

}
function clampBelt(f){
  if (f.z < BELT_TOP) f.z = BELT_TOP;
  if (f.z > BELT_BOT) f.z = BELT_BOT;

}
function tryPickup(p){
  for (var i=0;i<G.weapons.length;i++){
    var w = G.weapons[i];
    if (w.y <= 0 && Math.abs(w.x - p.x) < 16 && Math.abs(w.z - p.z) < 10){
      p.weapon = { type: w.type, dur: w.dur };

var WEAPON_STATS = {

  whip:  { reach: 34, dmg: 6,  dur: 10 }
};
// Launch (or convert a plain jump into) a flying kick. "fromGround" starts a

function startJumpKick(p, d, fromGround){
  p.face = d > 0 ? 1 : -1;
  p.state = "jumpkick"; p.tState = 0; p.atkKind = "jumpkick"; p.hitDone = false;
  p.vx = d * p.speed * 2.05;
  if (fromGround){
    p.y = 0.01; p.vy = JUMP_V * 0.86; p.vz = 0;
  } else {
    if (p.vy < JUMP_V * 0.35) p.vy = JUMP_V * 0.35;

  }

function startPlayerAttack(p, kind){

  if (p.y > 0) p.state = "jumpatk";
  var hc = HEROES[p.charId] || HEROES.ahLong;
  if (kind === "punch"){
    if (p.weapon){
      var ws = WEAPON_STATS[p.weapon.type];
      doAttackHit(p, ws.reach, 12, ws.dmg, p.face * 170, false);
      if (p.weapon.type === "whip") SFX.crack(); else SFX.swing();
      wearWeapon(p);
    } else {
      p.combo = (p.comboWin > 0) ? p.combo + 1 : 1;
      if (p.combo > 3) p.combo = 1;
      p.comboWin = 0.55 * hc.comboMul;
      var kd = (p.combo === 3);
      doAttackHit(p, 17, 10, Math.max(1, Math.round((kd ? 7 : 5) * hc.dmgMul)), p.face * (kd ? 250 : 120), kd);
      SFX.swing();
    }
  } else { // kick
    doAttackHit(p, 21, 11, Math.max(1, Math.round(7 * hc.dmgMul)), p.face * 260, false);

}
function wearWeapon(p){
  p.weapon.dur--;

}
function weaponOf(e){ return e.weapon; }

// resolve an attacker's strike: players hit enemies AND breakable props;
// enemies hit players (friendly fire OFF — players never hit each other).
function doAttackHit(atk, reach, zTol, dmg, kx, knockdown){
  var isPlayer = atk.idx !== undefined;
  var targets = isPlayer ? G.enemies : G.players;
  var hitAny = false;
  // the flying kick's leg reaches down to the ground from anywhere in its arc
  var yTol = (atk.state === "jumpkick") ? 140 : 26;
  for (var i=0;i<targets.length;i++){
    var t = targets[i];
    if (t.dead || t.state === "down") continue;
    if (Math.abs(t.y - atk.y) > yTol) continue;
    var dx = (t.x - atk.x) * atk.face;
    if (dx < -4 || dx > reach + t.w/2) continue;
    if (Math.abs(t.z - atk.z) > zTol + 4) continue;
    // grab: player unarmed punch, very close, enemy standing
    if (isPlayer && !atk.weapon && atk.atkKind === "punch" && dx < 13 && t.state !== "attack" && atk.y === 0){
      t.grabbedBy = atk; atk.grabTarget = t; atk.state = "grab"; atk.tState = 0; atk.combo = 0;
      t.state = "grabbed"; t.tState = 0;
      hitAny = true; break;
    }
    var heavy = (t.kind === "brute" || t.kind === "boss") && !knockdown && dmg < 8;

    if (ok){
      hitAny = true;
      if (isPlayer){

        G.hitstop = Math.max(G.hitstop, knockdown ? 0.07 : 0.045);
        if (t.dead) G.score += 100;
      }
    }
  }

  if (isPlayer && (atk.y === 0 || atk.state === "jumpkick")){
    for (var j=0;j<G.props.length;j++){
      var pr = G.props[j];
      if (pr.dead) continue;
      var pdx = (pr.x - atk.x) * atk.face;
      if (pdx < -6 || pdx > reach + 10) continue;
      if (Math.abs(pr.z - atk.z) > zTol + 8) continue;
      pr.hp -= 1;
      spawnDust(pr.x, pr.z, 2);

    }

}

// ---------- targeting helpers ----------
function nearestPlayer(e){
  var best = null, bd = 1e9;
  for (var i=0;i<G.players.length;i++){
    var q = G.players[i];
    if (q.dead) continue;
    var d = Math.abs(q.x - e.x) + Math.abs(q.z - e.z);
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}
function otherAlive(p){
  for (var i=0;i<G.players.length;i++) if (G.players[i] !== p && !G.players[i].dead) return true;
  return false;
}
// attack-token gate: only G.atkTokens enemies may be in windup/attack at once
function tokensUsed(except){
  var n = 0;
  for (var i=0;i<G.enemies.length;i++){
    var o = G.enemies[i];
    if (o !== except && o.state === "attack") n++;
  }
  return n;
}

// ---------- enemy update ----------
function enemyStep(e, dt){
  var p = nearestPlayer(e) || G.player;
  e.tState += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.invuln > 0) e.invuln -= dt;
  if (e.throwCd > 0) e.throwCd -= dt;

  if (e.state === "down"){
    e.y += e.vy * dt; e.vy -= GRAV * dt;
    e.x += e.vx * dt; e.vx *= 0.86;
    if (e.y <= 0 && e.vy < 0){ e.y = 0; e.vy = -e.vy * 0.35; if (Math.abs(e.vy) < 60) e.vy = 0; }
    if (e.tState > 0.8){
      if (e.dead){ e.removeMe = true; }
      else { e.state = "idle"; e.tState = 0; e.invuln = 0.7; }
    }
    return;
  }
  if (e.state === "grabbed"){
    if (!e.grabbedBy){ e.state = "idle"; e.tState = 0; }
    return;
  }
  if (e.state === "hurt"){
    e.x += e.vx * dt; e.vx *= 0.8;
    if (e.tState > 0.28){ e.state = "idle"; e.tState = 0; }
    return;
  }
  if (e.state === "attack"){
    var windup = (G.wave === 0) ? 0.30 : 0.22;
    if (!e.hitDone && e.tState > windup){
      e.hitDone = true;
      var reach = (e.kind === "brute" || e.kind === "boss") ? 26 : 18;
      doAttackHit(e, reach, 11, e.dmg, e.face * 180, e.chargeAtk === true);
    }
    if (e.tState > windup + 0.23){ e.state = "idle"; e.tState = 0; e.chargeAtk = false; }
    return;
  }
  if (e.state === "charge"){
    e.x += e.face * 200 * dt;
    if (!e.hitDone){
      for (var ci=0;ci<G.players.length;ci++){
        var cp = G.players[ci];
        if (!cp.dead && Math.abs(cp.x - e.x) < 20 && Math.abs(cp.z - e.z) < 12 && cp.y < 20){
          e.hitDone = true;
          hurt(cp, e.dmg, e.face * 260, { knockdown: true });

  var adx = Math.abs(dx), adz = Math.abs(dz);

  if (e.thinkT <= 0){

    if (adx < 90 && r < 0.18) e.aiMode = "circle";
    else if (r < 0.08) e.aiMode = "retreat";
    else e.aiMode = "approach";

    G.weapons.push({ type: "knife", dur: 3, x: e.x, z: e.z, y: 22, vy: 0, vx: e.face * 240, spin: 1, thrown: true });
    e.weapon = null; e.throwCd = 3;
    SFX.swing();
  }

  var inRange = adx < ((e.kind === "brute" || e.kind === "boss") ? 24 : 17) && adz < 9 && p.y < 14;
  if (inRange && e.invuln <= 0 && (e.kind === "boss" || tokensUsed(e) < G.atkTokens)){
    var atkChance = (e.kind === "boss") ? 0.05 : 0.035;
    if (G.rng.chance(atkChance)){
      e.state = "attack"; e.tState = 0; e.hitDone = false;
      e.chargeAtk = false;
      SFX.swing();
      return;
    }
  }
  // brute/boss shoulder charge from mid range
  if ((e.kind === "brute" || e.kind === "boss") && adx > 55 && adx < 110 && adz < 8 && e.invuln <= 0 && G.rng.chance(e.kind === "boss" ? 0.014 : 0.008)){
    e.state = "charge"; e.tState = 0; e.hitDone = false;
    SFX.swing();
    return;
  }
  var sp = e.speed;
  var mvx = 0, mvz = 0;
  if (e.aiMode === "approach"){
    if (adx > 13) mvx = Math.sign(dx) * sp;
    if (adz > 4) mvz = Math.sign(dz) * sp * 0.7;
  } else if (e.aiMode === "circle"){
    mvz = (Math.sin(G.time * 1.7 + e.seedOff) > 0 ? 1 : -1) * sp * 0.55;
    if (adx > 30) mvx = Math.sign(dx) * sp * 0.6;
  } else if (e.aiMode === "retreat"){
    mvx = -Math.sign(dx) * sp * 0.7;
  }
  e.x += mvx * dt; e.z += mvz * dt;
  if (mvx !== 0 || mvz !== 0){ e.state = "walk"; e.walkPh += dt * 8; } else e.state = "idle";
  clampBelt(e);
  // keep enemies from stacking exactly
  for (var j=0;j<G.enemies.length;j++){
    var o = G.enemies[j];
    if (o !== e && !o.dead && Math.abs(o.x - e.x) < 10 && Math.abs(o.z - e.z) < 6) e.x += (e.x < o.x ? -8 : 8) * dt;
  }
}

// thrown weapons / loose weapons physics
function weaponStep(dt){
  for (var i=G.weapons.length-1;i>=0;i--){
    var w = G.weapons[i];
    if (w.thrown){
      w.x += w.vx * dt; w.spin += dt * 18;
      var hitP = null;
      for (var pi=0;pi<G.players.length;pi++){
        var pp = G.players[pi];
        if (!pp.dead && Math.abs(pp.x - w.x) < 10 && Math.abs(pp.z - w.z) < 8 && pp.y < 26 && pp.state !== "down"){ hitP = pp; break; }
      }
      if (hitP){
        hurt(hitP, 5, Math.sign(w.vx) * 160, {});
        G.weapons.splice(i,1); continue;
      }
      if (w.x < G.cam - 40 || w.x > G.cam + W + 60){ G.weapons.splice(i,1); continue; }
    } else if (w.y > 0 || w.vy !== 0){
      w.y += w.vy * dt; w.vy -= GRAV * dt; w.x += (w.vx || 0) * dt; w.vx *= 0.9;
      if (w.y <= 0){ w.y = 0; w.vy = 0; w.vx = 0; }
    }
  }
}

// food pickup: walk over a dropped food item to eat it (+25 HP, capped)
function tryFood(p){
  if (p.dead || p.y > 0) return;
  for (var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    if (!q.food) continue;
    if (Math.abs(q.x - p.x) < 14 && Math.abs(q.z - p.z) < 9){
      G.parts.splice(i,1);
      p.hp = Math.min(p.maxhp, p.hp + 25);
      addFloat(p.x, p.z, "+25", "#7ae0a3");
      SFX.pickup();
      return;
    }
  }
}

// derive one player's action edges from their press buffer for this step
function deriveEdges(pin){
  pin.edge.punchP = pin.buf.punch > 0;
  pin.edge.kickP = pin.buf.kick > 0;
  pin.edge.jumpP = pin.buf.jump > 0;
  if (pin.buf.punch > 0) pin.buf.punch--;
  if (pin.buf.kick > 0) pin.buf.kick--;
  if (pin.buf.jump > 0) pin.buf.jump--;
}
function allPlayersDead(){
  for (var i=0;i<G.players.length;i++) if (!G.players[i].dead) return false;
  return true;
}
// co-op: a downed player comes back when the arena clears (fight->go)
// or the next wave starts, with half HP — as long as a partner is alive
function respawnCheck(){
  if (G.mode !== "2P") return;
  if (G.phase !== "go" && G.phase !== "fight") return;
  for (var i=0;i<G.players.length;i++){
    var q = G.players[i];
    if (q.dead && otherAlive(q)){
      q.dead = false; q.removeMe = false;
      q.hp = Math.floor(q.maxhp / 2);
      var alive = null;
      for (var j=0;j<G.players.length;j++) if (!G.players[j].dead && G.players[j] !== q) alive = G.players[j];
      q.x = alive ? Math.max(14, alive.x - 30) : 80;
      q.z = alive ? alive.z : 215;
      q.y = 0; q.vy = 0; q.vx = 0; q.state = "idle"; q.tState = 0; q.invuln = 1.0;
      q.weapon = null; q.grabTarget = null; q.grabbedBy = null;
      addFloat(q.x, q.z, "復活！", "#8ad2ff");
    }
  }
}

// ---------- main sim step ----------
function simStep(dt){
  // derive this step's action edges from the press buffers (single source:
  // buffers are armed by input producers, ticked down here, and zeroed by
  // playerStep when actually consumed — so a press survives hitstop and
  // busy states instead of being silently dropped).
  var pin1 = getPin(G.players[0]);
  deriveEdges(pin1);
  var pin2 = (G.mode === "2P" && G.players[1]) ? getPin(G.players[1]) : null;
  if (pin2) deriveEdges(pin2);
  if (G.phase === "title" || G.phase === "clear" || G.phase === "over"){
    G.tick++;
    if (input.startP || uiStartFlag){
      uiStartFlag = false;
      var seed2 = fixedSeed;
      G = newGame(seed2, { mode: G.selMode, chars: G.selMode === "2P" ? ["ahLong", "ahFu"] : [selIdx === 1 ? "ahFu" : "ahLong"] });
      G.phase = "fight";
      startWave(0);
      SFX.go();
    }
    input.startP = false;
    return;
  }
  if (G.phase === "select"){ G.tick++; selectStep(); return; }
  if (G.phase === "lobby"){ G.tick++; return; }
  if (paused && !(NET && NET.active)) return;
  G.tick++; G.time += dt;
  if (G.hitstop > 0){ G.hitstop -= dt; decayFx(dt);
    // keep direction levels in sync so a held direction is not mistaken
    // for a fresh double-tap when hitstop ends (playerStep also mirrors
    // levels into each player's own prevLv every step)
    prevInput.left = input.left; prevInput.right = input.right;
    prevInput.up = input.up; prevInput.down = input.down;
    return; }

  for (var pi=0;pi<G.players.length;pi++) playerStep(G.players[pi], dt);
  var p = leadPlayer();
  prevInput.punch = input.punch; prevInput.kick = input.kick; prevInput.jump = input.jump;
  prevInput.left = input.left; prevInput.right = input.right;
  prevInput.up = input.up; prevInput.down = input.down;

  for (var i=G.enemies.length-1;i>=0;i--){
    var e = G.enemies[i];
    enemyStep(e, dt);
    if (e.removeMe) G.enemies.splice(i,1);
  }
  weaponStep(dt);
  respawnCheck();

  // particles + floaters
  decayFx(dt);
  for (var fi=G.floats.length-1;fi>=0;fi--){
    var fl = G.floats[fi]; fl.t += dt;
    if (fl.t > fl.life) G.floats.splice(fi,1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 14);

  // camera follows the lead (leftmost living) player, clamped to the gate.
  // Moves toward the target at a fixed per-step rate (frame-count based,
  // not exponential) so replays are bit-exact.
  var want = p.x - 150;
  var maxCam = (G.phase === "fight") ? (G.gate - W + 60) : (WORLD_LEN - W);
  if (want > maxCam) want = maxCam;
  if (want < 0) want = 0;
  if (want < G.cam) want = G.cam; // never scroll back
  var cd = want - G.cam;
  var cStep = 320 * dt;
  if (cd > cStep) G.cam += cStep; else if (cd < -cStep) G.cam -= cStep; else G.cam = want;
  if (G.cam > WORLD_LEN - W) G.cam = WORLD_LEN - W;

  // wave clear?
  if (G.phase === "fight" && G.enemies.length === 0){
    if (G.wave >= 3){
      G.phase = "clear"; G.clearTimer = 0; SFX.clear();
      var nb = 0;
      for (var bi=0;bi<G.players.length;bi++) if (!G.players[bi].dead) nb += Math.floor(G.players[bi].hp) * 10;
      nb += Math.max(0, 600 - Math.floor(G.time)) * 2;
      if (nb > 0) G.score += nb;
    } else {
      G.phase = "go"; G.goTimer = 0; SFX.go();
    }
  }
  if (G.phase === "go"){
    G.goTimer += dt;
    respawnCheck();
    // a living player walks past old gate -> trigger next wave in its zone
    var next = WAVES[G.wave + 1];
    if (next){
      for (var gi=0;gi<G.players.length;gi++){
        if (!G.players[gi].dead && G.players[gi].x > next.gate - 330){ startWave(G.wave + 1); break; }
      }
    }
  }
  if (G.phase === "clear") G.clearTimer += dt;
  if (allPlayersDead()){
    if (G.phase !== "over"){ G.phase = "over"; SFX.over(); }
  }
}
function leadPlayer(){
  var best = null;
  for (var i=0;i<G.players.length;i++){
    var q = G.players[i];
    if (q.dead) continue;
    if (!best || q.x < best.x) best = q;
  }
  return best || G.players[0];
}
function decayFx(dt){
  for (var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    if (q.food){ continue; } // food pickups rest on the ground until eaten
    q.t += dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 300 * dt;
    if (q.y < 0) q.y = 0;
    if (q.t > q.life) G.parts.splice(i,1);
  }
}

var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

function R(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x|0, y|0, Math.ceil(w), Math.ceil(h)); }
function TXT(s, x, y, size, color, align, bold){
  ctx.fillStyle = color;
  ctx.font = (bold ? "bold " : "") + size + "px 'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif";
  ctx.textAlign = align || "left"; ctx.textBaseline = "top";

  ctx.fillStyle = "rgba(0,0,0,0.14)";

// ===================== HD ART HELPERS (v5) =====================
// All artwork is drawn in the same 480x270 logical space as the sim, but the
// backing store is 2-3x larger (RS). Static parallax layers are baked once
// into offscreen canvases so a phone only blits a few bitmaps per frame.
function PX(c, x, y, w, h, col){ if (w <= 0 || h <= 0) return; c.fillStyle = col; c.fillRect(x, y, w, h); }
function ROUND(c, x, y, w, h, col, rad){
  if (w <= 0 || h <= 0) return;
  rad = Math.max(0, Math.min(rad || 0, w/2, h/2));
  c.fillStyle = col; c.beginPath();
  c.moveTo(x+rad, y); c.lineTo(x+w-rad, y); c.quadraticCurveTo(x+w, y, x+w, y+rad);
  c.lineTo(x+w, y+h-rad); c.quadraticCurveTo(x+w, y+h, x+w-rad, y+h);
  c.lineTo(x+rad, y+h); c.quadraticCurveTo(x, y+h, x, y+h-rad);
  c.lineTo(x, y+rad); c.quadraticCurveTo(x, y, x+rad, y); c.closePath(); c.fill();
}
function LGRAD(c, x0, y0, x1, y1, stops){
  var g = c.createLinearGradient(x0, y0, x1, y1);
  for (var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}
function RGRAD(c, x, y, r0, r1, stops){
  var g = c.createRadialGradient(x, y, r0, x, y, r1);
  for (var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}
function TXTC(c, s, x, y, size, color, align, bold){
  c.fillStyle = color;
  c.font = (bold ? "bold " : "") + size + "px 'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif";
  c.textAlign = align || "left"; c.textBaseline = "top";
  c.fillText(s, x, y);
}
function shade(hex, k){
  if (!hex || hex.charAt(0) !== "#") return hex || "#888";
  var n = parseInt(hex.slice(1), 16), r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if (k >= 0){ r += (255-r)*k; g += (255-g)*k; b += (255-b)*k; }
  else { r *= (1+k); g *= (1+k); b *= (1+k); }
  return "rgb(" + (r|0) + "," + (g|0) + "," + (b|0) + ")";
}
function hash01(n){ var v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }

var ASSETS = { dirty:true, sky:null, city:null, shops:null, road:null, lamp:null,

}

  var RH = H - BELT_TOP + 4;
  PX(g, 0, 0, W, RH, LGRAD(g, 0, 0, 0, RH,
    [[0,"#3b3a49"], [0.28,"#2c2b38"], [0.72,"#24232d"], [1,"#1a1922"]]));
  PX(g, 0, 0, W, 6, "#4c4a5e"); PX(g, 0, 0, W, 1.4, "#66647c");
  PX(g, 0, 6, W, 2, "rgba(0,0,0,0.30)");
  // pavement joints
  for (i=0;i<Math.ceil(W/38)+1;i++){
    PX(g, i*38, 0, 1, 9, "rgba(0,0,0,0.22)");
    PX(g, i*38 + 18, 9, 1, 12, "rgba(0,0,0,0.10)");
  }
  // wet asphalt reflections from the shopfronts
  for (i=0;i<Math.ceil(W/70)+1;i++){
    var rx = i*70 + 12;
    PX(g, rx, 12, 20, RH - 16, LGRAD(g, rx, 12, rx, RH,
      [[0,"rgba(255,190,110,0.10)"],[0.6,"rgba(130,150,220,0.05)"],[1,"rgba(0,0,0,0)"]]));
  }
  for (i=0;i<46;i++){
    var gx = hash01(i*3.7)*W, gy = 12 + hash01(i*9.1)*(RH-16);
    PX(g, gx, gy, 2 + hash01(i*5.3)*5, 0.7, "rgba(190,190,210,0.07)");
  }
  // manhole covers
  for (i=0;i<Math.ceil(W/240)+1;i++){
    var mhx = 120 + i*240;
    g.fillStyle = "rgba(12,12,18,0.55)"; g.beginPath(); g.ellipse(mhx, 40, 13, 4, 0, 0, 6.2832); g.fill();
    g.strokeStyle = "rgba(120,120,140,0.25)"; g.lineWidth = 0.8;
    g.beginPath(); g.ellipse(mhx, 40, 10, 3, 0, 0, 6.2832); g.stroke();
  }
  PX(g, 0, RH - 11, W, 11, "#1c1b24");
  PX(g, 0, RH - 11, W, 1, "rgba(120,120,145,0.18)");
  ASSETS.road = road;

  // ---------- LAMP (glow baked once, blitted at world positions) ----------
  var lamp = makeLayer(34, 124); g = lamp.g;
  g.fillStyle = RGRAD(g, 17, 16, 2, 26, [[0,"rgba(255,220,120,0.55)"],[0.5,"rgba(255,200,90,0.14)"],[1,"rgba(255,200,90,0)"]]);
  g.fillRect(0, 0, 34, 60);
  PX(g, 15, 14, 3.5, 96, "#1c1c26");
  PX(g, 15, 14, 1, 96, "#3b3b4a");
  PX(g, 10, 12, 14, 4, "#2a2a34");
  ROUND(g, 9, 8, 16, 7, "#ffd94a", 2);
  PX(g, 11, 9, 12, 2, "#fff2b0");
  PX(g, 9, 106, 16, 4, "#20202a");
  ASSETS.lamp = lamp;
}

// HD character sprites: layered shading, outlines, facial detail and
// per-state poses. All hitboxes / animation timing stay exactly as before.
function drawFighter(f){
  var sx = Math.round(f.x - G.cam);
  var gy = Math.round(f.z);
  var sy = gy - Math.round(f.y);
  if (sx < -80 || sx > W + 80) return;
  var face = f.face, flash = f.flash > 0, C;
  if (f.kind === "hero")        C = { skin:"#f0c08a", hair:"#22242e", top:"#d33f2e", top2:"#a82a1e", pants:"#2b3a67", shoes:"#f2f2f2", belt:"#ffd94a" };
  else if (f.kind === "hero2")  C = { skin:"#e8b078", hair:"#5a3410", top:"#1f9d8f", top2:"#14706a", pants:"#5b2a6e", shoes:"#ffd94a", belt:"#ffffff" };
  else if (f.kind === "brawler")C = { skin:"#d99a5f", hair:"#101010", top:"#3f7a3a", top2:"#2c5528", pants:"#4a3423", shoes:"#222", belt:"#888" };
  else if (f.kind === "carrier")C = { skin:"#f0c8a0", hair:"#7a1f3d", top:"#7a2d8f", top2:"#5a1f6a", pants:"#22242e", shoes:"#c22", belt:"#ddd" };
  else if (f.kind === "brute")  C = { skin:"#c98a54", hair:"#000", top:"#28418c", top2:"#1a2c5f", pants:"#333", shoes:"#111", belt:"#c9a227" };
  else                          C = { skin:"#e0aa72", hair:"#3a3a3a", top:"#15151c", top2:"#000", pants:"#1c1c26", shoes:"#000", belt:"#ffd94a" };
  if (flash){ for (var ck in C) C[ck] = "#ffffff"; }
  var dark    = flash ? "#cfcfe0" : "#100e18";
  var skinD   = shade(C.skin, -0.24),  skinL  = shade(C.skin, 0.16);
  var topD    = shade(C.top, -0.32),   topL   = shade(C.top, 0.20);
  var pantD   = shade(C.pants, -0.30), pantL  = shade(C.pants, 0.16);
  var shoeD   = shade(C.shoes, -0.34);
  var big = (f.kind === "brute" || f.kind === "boss");
  var u = big ? 1.22 : 1;
  var bw = Math.round(14 * u), bh = f.h;
  var legH = Math.round(bh * 0.38), bodyTop = -bh;
  var shY = bodyTop + Math.round(bh * 0.36), hd = Math.round(bh * 0.24);
  var st = f.state, kind = f.atkKind;
  var jk = (st === "jumpkick" || ((st === "jumpatk" || st === "attack") && kind === "jumpkick"));
  var kickExt = ((st === "attack" || st === "jumpatk") && kind === "kick");
  var knee = (st === "attack" && kind === "knee");
  var down = (st === "down");
  var sw = (st === "walk") ? Math.round(Math.sin(f.walkPh) * 3) : 0;
  shadow(sx, gy, bw + 5);
  ctx.save(); ctx.translate(sx, sy);
  if (down){
    ROUND(ctx, -bw - 2, -5.5, bw * 2 + 4, 6, pantD, 2);
    ROUND(ctx, -bw - 5 * face, -9, bw + 5, 7, C.top, 2);
    PX(ctx, -bw - 5 * face, -9, bw + 5, 1.6, topL);
    ROUND(ctx, (face > 0 ? -bw - 12 : bw + 3), -9, 9, 8, C.skin, 2);
    PX(ctx, (face > 0 ? -bw - 12 : bw + 3), -10, 9, 3.2, C.hair);
    PX(ctx, (face > 0 ? -bw - 10 : bw + 5), -4, 1.6, 1.4, dark);
    ctx.restore();
    drawNameHp(f, sx, gy - bh - 8);
    return;
  }
  // ---- flying-kick speed trail ----
  if (jk){
    for (var ti=0; ti<3; ti++)
      PX(ctx, -face * (bw/2 + 9 + ti*8), -bh*0.68 + ti*7, 10, 1.1,
         "rgba(255,226,140," + (0.52 - ti*0.14).toFixed(2) + ")");
  }
  // ---- legs ----
  if (jk){
    ctx.save(); ctx.scale(face, 1);
    ROUND(ctx, -bw/2 - 2, -legH + 5, 5*u, legH*0.72, pantD, 2);
    ROUND(ctx, -bw/2 - 3, -4.5, 7*u, 3.6, C.shoes, 1.4);
    PX(ctx, -bw/2 - 3, -1.2, 7*u, 1.2, shoeD);
    ROUND(ctx, bw/2 - 4, -legH + 1, 23*u, 6.4, C.pants, 2);
    PX(ctx, bw/2 - 4, -legH + 1, 23*u, 1.8, pantL);
    ROUND(ctx, bw/2 + 17*u, -legH - 0.5, 8.5, 7.6, C.shoes, 2);
    PX(ctx, bw/2 + 17*u, -legH + 5.6, 8.5, 1.6, shoeD);
    PX(ctx, bw/2 + 20*u, -legH + 1, 2, 3, "#ffffff");
    ctx.restore();
  } else {
    ROUND(ctx, -bw/2 + 1 + sw, -legH, 5*u, legH, pantD, 1.6);
    PX(ctx, -bw/2 + 1 + sw, -legH, 5*u, 1.6, pantL);
    ROUND(ctx, -bw/2 + sw, -3.4, 6.4*u, 3.6, C.shoes, 1.4);
    PX(ctx, -bw/2 + sw, -0.8, 6.4*u, 1.2, shoeD);
    if (kickExt){
      ctx.save(); ctx.scale(face, 1);
      ROUND(ctx, bw/2 - 4, -legH + 1, 17*u, 5.6, C.pants, 2);
      PX(ctx, bw/2 - 4, -legH + 1, 17*u, 1.6, pantL);
      ROUND(ctx, bw/2 + 11*u, -legH, 7, 6.6, C.shoes, 2);
      PX(ctx, bw/2 + 11*u, -legH + 5, 7, 1.4, shoeD);
      ctx.restore();
    } else if (knee){
      ROUND(ctx, face*(bw/2 - 2), -legH - 7, 6, 11, C.pants, 2);
      PX(ctx, face*(bw/2 - 2), -legH - 7, 6, 1.6, pantL);
    } else {
      ROUND(ctx, bw/2 - 5.6*u - sw, -legH, 5*u, legH, pantD, 1.6);
      PX(ctx, bw/2 - 5.6*u - sw, -legH, 5*u, 1.6, pantL);
      ROUND(ctx, bw/2 - 5.6*u - sw, -3.4, 6.4*u, 3.6, C.shoes, 1.4);
      PX(ctx, bw/2 - 5.6*u - sw, -0.8, 6.4*u, 1.2, shoeD);
    }
  }
  // ---- torso ----
  var torsoY = bodyTop + Math.round(bh * 0.33);
  ROUND(ctx, -bw/2, torsoY, bw, Math.round(bh * 0.32), C.top, 2);
  PX(ctx, -bw/2 + 1, torsoY, bw - 2, 2.2, topL);
  PX(ctx, -bw/2 + 1, torsoY, 2, Math.round(bh*0.32) - 2, topL);
  PX(ctx, bw/2 - 3, torsoY, 2, Math.round(bh*0.32) - 2, topD);
  PX(ctx, -2.5, torsoY, 5, 3, skinD);                 // collar
  PX(ctx, -bw/2 + 3, torsoY + Math.round(bh*0.17), bw - 6, 1, "rgba(0,0,0,0.18)");
  if (f.kind === "hero" || f.kind === "hero2"){
    // dragon emblem / sash on the chest
    PX(ctx, -3, torsoY + 5, 6, 1.4, shade(C.belt, -0.10));
    PX(ctx, -1, torsoY + 7, 2.4, 2.4, C.belt);
  }
  if (f.kind === "boss"){
    PX(ctx, -hd/2 + 1, torsoY - 1, hd - 2, 2.4, "#ffd94a");  // gold chain
    PX(ctx, -2, torsoY + 3, 4, 4, "#ffe9a8");
  }
  if (f.kind === "brute") PX(ctx, -bw/2 + 2, torsoY + 4, bw - 4, 1.2, topD);
  // belt
  PX(ctx, -bw/2, -legH - 2.6, bw, 3.4, C.belt);
  PX(ctx, -bw/2, -legH - 2.6, bw, 1, shade(C.belt, 0.25));
  PX(ctx, -1.6, -legH - 2.6, 3.2, 3.4, shade(C.belt, -0.35));
  // ---- head ----
  ROUND(ctx, -hd/2, bodyTop, hd, hd, C.skin, 2.6);
  PX(ctx, -hd/2 + 1, bodyTop + hd - 3, hd - 2, 2, skinD);
  PX(ctx, -hd/2, bodyTop, hd, Math.round(hd*0.36), C.hair);
  PX(ctx, -hd/2, bodyTop, hd, 1.4, shade(C.hair, 0.25));
  PX(ctx, face*(hd/2 - 1), bodyTop + hd*0.46, 2, 3.2, skinD);       // ear
  PX(ctx, face*(hd*0.15) - 0.9, bodyTop + hd*0.55, 1.9, 1.9, dark); // eye
  PX(ctx, face*(hd*0.10) - 1.5, bodyTop + hd*0.45, 3.2, 1.1, C.hair);
  if (f.kind === "hero")  PX(ctx, -hd/2, bodyTop + hd*0.30, hd, 2.2, "#f2e3b0"); // headband
  if (f.kind === "hero2") PX(ctx, -hd/2, bodyTop + hd*0.28, hd, 2, "#39d0c4");
  if (f.kind === "boss")  PX(ctx, -hd/2 + 1, bodyTop + hd*0.48, hd - 2, 3, "#0b0b12"); // shades
  if (f.kind === "carrier"){
    PX(ctx, face*(hd/2 - 1), bodyTop + 2, 3, hd + 5, C.hair);        // long ponytail
    PX(ctx, face*(hd/2 - 1), bodyTop + hd + 3, 3, 3, "#e5484d");
  }
  // ---- arms ----
  var armC = C.top2, armL = shade(C.top2, 0.22);
  if (jk){
    // both arms swept back for balance
    ROUND(ctx, -face*(bw/2 + 9), shY - 6, 11, 4.4*u, armC, 2);
    ROUND(ctx, -face*(bw/2 + 8), shY + 1, 9, 4.2*u, armC, 2);
    PX(ctx, -face*(bw/2 + 15), shY - 6, 4, 4, C.skin);
  } else if (st === "attack" && !kickExt && !knee){
    var ext = f.weapon ? WEAPON_STATS[f.weapon.type].reach : 14;
    var hx = face * (bw/2 + ext * 0.55);
    ROUND(ctx, Math.min(hx, face*(bw/2-1)), shY + 1, Math.abs(face*ext*0.55), 4.6*u, armC, 2);
    if (f.weapon) drawWeaponInHand(f.weapon.type, hx, shY + 3, face, flash);
    else { ROUND(ctx, hx - 2, shY, 5.4, 5.4, C.skin, 1.6); PX(ctx, hx - 1, shY + 1, 2, 1.4, skinL); }
    ROUND(ctx, -face*(bw/2 + 1), shY + 3, 4.4*u, Math.round(bh*0.20), armC, 1.6);
  } else if (kickExt || knee){
    ROUND(ctx, -face*(bw/2 + 2), shY, 4.6*u, Math.round(bh*0.24), armC, 1.6);
    ROUND(ctx, face*(bw/2 - 1), shY - 3, 4.6*u, Math.round(bh*0.20), armC, 1.6);
    PX(ctx, face*(bw/2 - 1), shY - 3, 4.6*u, 1.4, armL);
  } else if (st === "dash" || st === "charge"){
    ROUND(ctx, face*(bw/2 - 1), shY + 2, face*12, 4.6*u, armC, 2);
    ROUND(ctx, -face*(bw/2 + 1), shY + 2, 4.4*u, Math.round(bh*0.20), armC, 1.6);
  } else if (st === "hurt" || st === "grabbed"){
    ROUND(ctx, -face*(bw/2 + 2), shY - 4, 4.6*u, Math.round(bh*0.20), armC, 1.6);
    ROUND(ctx, face*(bw/2 - 1), shY - 4, 4.6*u, Math.round(bh*0.20), armC, 1.6);
  } else if (st === "grab"){
    ROUND(ctx, face*(bw/2 - 1), shY + 1, face*11, 4.4*u, armC, 2);
    ROUND(ctx, face*(bw/2 - 1), shY + 7, face*10, 4.4*u, armC, 2);
    PX(ctx, face*(bw/2 + 8), shY + 1, 3.6, 4, C.skin);
  } else {
    var aw = (st === "walk") ? Math.round(Math.sin(f.walkPh) * 2) : 0;
    ROUND(ctx, -face*(bw/2 + 1), shY, 4.4*u, Math.round(bh*0.26), armC, 1.6);
    ROUND(ctx, face*(bw/2 - 3), shY + aw, 4.4*u, Math.round(bh*0.26), armC, 1.6);
    PX(ctx, face*(bw/2 - 3), shY + aw + Math.round(bh*0.26) - 3, 4.4*u, 3, C.skin);
    if (f.weapon) drawWeaponInHand(f.weapon.type, face*(bw/2 + 1), shY + Math.round(bh*0.26), face, flash);
  }
  ctx.restore();
  drawNameHp(f, sx, gy - bh - 8 - Math.round(f.y));
}
function drawNameHp(f, sx, y){
  if (f.idx !== undefined || f.kind === "boss") return;
  if (f.dead) return;
  var w = 26;
  ROUND(ctx, sx - w/2 - 1, y - 1.5, w + 2, 5, "rgba(4,4,10,0.72)", 1.5);
  PX(ctx, sx - w/2, y, w * Math.max(0, f.hp / f.maxhp), 2, "#e5484d");
  PX(ctx, sx - w/2, y, w * Math.max(0, f.hp / f.maxhp), 0.8, "#ff8a8e");
}
function drawWeaponInHand(type, x, y, face, flash){
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  var metal = LGRAD(ctx, 0, -3, 0, 3, [[0,"#f2f5fa"],[0.5,"#aeb8c8"],[1,"#5d6675"]]);
  if (type === "bat"){
    ROUND(ctx, 0, -2.2, 17, 4.4, flash ? "#fff" : "#8a5a2c", 2);
    PX(ctx, 1, -2, 13, 1.2, flash ? "#fff" : "#c99a5c");
    PX(ctx, 14, -3.2, 4.5, 6.4, flash ? "#fff" : "#a9763c");
    PX(ctx, 0, 0, 5, 2, "#3a2a18");
  } else if (type === "knife"){
    PX(ctx, 0, -1.2, 5, 3.4, flash ? "#fff" : "#5d4026");
    PX(ctx, 4, -2, 12, 2.4, metal);
    PX(ctx, 4, -2, 12, 0.8, "#ffffff");
    PX(ctx, 3, -2.4, 1.6, 4, "#8a8a94");
  } else {
    PX(ctx, 0, -1, 3, 3, "#5d4026");
    ctx.fillStyle = flash ? "#fff" : "#9a6530";
    ctx.fillRect(3, -1, 20, 2); ctx.fillRect(21, 0.5, 6, 1.6);
    PX(ctx, 3, -1, 20, 0.6, "#d7a25c");
  }
  ctx.restore();
}
function drawWeaponGround(w){
  var sx = Math.round(w.x - G.cam), sy = Math.round(w.z - w.y);
  shadow(sx, w.z, 13);
  ctx.save(); ctx.translate(sx, sy - 2);
  if (w.thrown) ctx.rotate(w.spin);
  var metal = LGRAD(ctx, -8, -3, -8, 3, [[0,"#eef2f8"],[0.5,"#a8b2c2"],[1,"#59616f"]]);
  if (w.type === "bat"){
    ROUND(ctx, -9, -2.4, 18, 4.4, "#8a5a2c", 2);
    PX(ctx, -8, -2, 14, 1.2, "#c99a5c");
    PX(ctx, 7, -3.2, 4.6, 6.4, "#a9763c");
  } else if (w.type === "knife"){
    PX(ctx, -8, -1.2, 5, 3.2, "#5d4026");
    PX(ctx, -3, -2, 12, 2.4, metal);
    PX(ctx, -3, -2, 12, 0.7, "#ffffff");
  } else {
    PX(ctx, -9, -1, 15, 2, "#9a6530");
    PX(ctx, 4, 0.5, 6, 1.6, "#9a6530");
    PX(ctx, -12, -2.4, 3.4, 4, "#5d4026");
  }
  ctx.restore();
}

// ---------- background: baked HD parallax layers ----------
function drawBG(){
  if (ASSETS.dirty || !ASSETS.sky) bakeAssets();
  if (!ASSETS.sky) return;
  ctx.drawImage(ASSETS.sky.c, 0, 0, ASSETS.sky.w, ASSETS.sky.h);
  var i, cw = ASSETS.cityW, sw = ASSETS.shopsW;
  var off1 = Math.floor(G.cam * 0.25) % cw;
  for (i=0;i<Math.ceil(W/cw)+2;i++)
    ctx.drawImage(ASSETS.city.c, Math.round(-off1 + i*cw), 0, cw, ASSETS.city.h);
  var off2 = Math.floor(G.cam * 0.6) % sw;
  for (i=0;i<Math.ceil(W/sw)+2;i++)
    ctx.drawImage(ASSETS.shops.c, Math.round(-off2 + i*sw), 0, sw, ASSETS.shops.h);
  ctx.drawImage(ASSETS.road.c, 0, BELT_TOP, ASSETS.road.w, ASSETS.road.h);
  // world-anchored lane dashes
  var dashOff = Math.floor(G.cam) % 46;
  for (var d=-1; d<Math.ceil(W/46)+2; d++){
    PX(ctx, d*46 - dashOff, 226, 24, 3, "rgba(180,178,205,0.42)");
    PX(ctx, d*46 - dashOff, 226, 24, 0.8, "rgba(230,228,245,0.30)");
  }
  drawLamps();
  // soft vignette keeps the eye on the fighters
  ctx.fillStyle = LGRAD(ctx, 0, 0, 0, H,
    [[0,"rgba(0,0,0,0.16)"],[0.22,"rgba(0,0,0,0)"],[0.82,"rgba(0,0,0,0)"],[1,"rgba(0,0,0,0.28)"]]);
  ctx.fillRect(0, 0, W, H);
}
var LAMPS = [700, 1330, 2380];
function drawLamps(){
  for (var i=0;i<LAMPS.length;i++){
    var sx = Math.round(LAMPS[i] - G.cam);
    if (sx < -40 || sx > W + 40) continue;
    // warm pool of light on the asphalt
    ctx.fillStyle = RGRAD(ctx, sx, 214, 2, 52,
      [[0,"rgba(255,214,120,0.20)"],[0.55,"rgba(255,200,90,0.07)"],[1,"rgba(255,200,90,0)"]]);
    ctx.fillRect(sx-52, 174, 104, 80);
    ctx.drawImage(ASSETS.lamp.c, sx - 17, 82, 34, 124);
  }
}
function drawProp(pr){
  var sx = Math.round(pr.x - G.cam), gy = Math.round(pr.z);
  if (sx < -34 || sx > W + 34) return;
  shadow(sx, gy, 18);
  if (pr.t === "crate"){
    var wood = pr.hp < 3 ? "#7d5a33" : "#805d38";
    ROUND(ctx, sx - 10, gy - 17, 20, 17, "#3a2a16", 1.5);
    ROUND(ctx, sx - 9, gy - 16, 18, 15, wood, 1);
    PX(ctx, sx - 9, gy - 16, 18, 2.2, "#a67c48");
    PX(ctx, sx - 9, gy - 16, 1.6, 15, "#a67c48");
    PX(ctx, sx + 7, gy - 16, 1.6, 15, "#4a341d");
    // cross braces + nails
    ctx.strokeStyle = "rgba(60,40,20,0.65)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(sx-8, gy-14); ctx.lineTo(sx+8, gy-3);
    ctx.moveTo(sx+8, gy-14); ctx.lineTo(sx-8, gy-3); ctx.stroke();
    PX(ctx, sx - 8, gy - 15, 1.4, 1.4, "#d9bb84");
    PX(ctx, sx + 6, gy - 15, 1.4, 1.4, "#d9bb84");
    PX(ctx, sx - 8, gy - 4, 1.4, 1.4, "#d9bb84");
    PX(ctx, sx + 6, gy - 4, 1.4, 1.4, "#d9bb84");
    if (pr.hp === 1){
      ctx.strokeStyle = "#2b1c0c"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sx-5, gy-13); ctx.lineTo(sx-1, gy-9); ctx.lineTo(sx+2, gy-11); ctx.stroke();
    }
  } else {
    ROUND(ctx, sx - 8, gy - 19, 16, 19, "#25372b", 1.5);
    ROUND(ctx, sx - 7, gy - 18, 14, 17, pr.hp < 3 ? "#486a52" : "#3d5a44", 1);
    PX(ctx, sx - 7, gy - 18, 14, 1.6, "#699078");
    for (var bi=0;bi<3;bi++) PX(ctx, sx - 6 + bi*5, gy - 16, 1, 13, "rgba(20,40,28,0.35)");
    ROUND(ctx, sx - 9, gy - 21, 18, 3.6, "#2c4433", 1.5);
    PX(ctx, sx - 9, gy - 21, 18, 1.2, "#5a7a63");

function drawTouch(){
  if (!touchMode) return;
  // Fade the stick when a fighter is standing behind it — at wave spawn the
  // hero sits at x≈80 / z≈215, right under a fixed-base stick at 62 / 200.
  // Fading the overlay (rather than moving it) keeps touch maths unchanged.
  var fade = 1, k, q, fs;
  if (G && (G.phase === "fight" || G.phase === "go")){
    fs = G.players.concat(G.enemies);
    for (k = 0; k < fs.length; k++){
      q = fs[k];
      if (q.removeMe) continue;
      if (Math.abs((q.x - G.cam) - JOY_X) < 44 && Math.abs(q.z - JOY_Y) < 52){ fade = 0.32; break; }
    }
  }
  // left stick: outer ring, base, knob, crosshair
  ctx.fillStyle = "rgba(8,10,22," + (0.30 * fade).toFixed(2) + ")";
  ctx.beginPath(); ctx.arc(JOY_X, JOY_Y, JOY_R + 5, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255," + (0.26 * fade).toFixed(2) + ")"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(JOY_X, JOY_Y, JOY_R, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255," + (0.09 * fade).toFixed(2) + ")";
  ctx.beginPath(); ctx.arc(JOY_X, JOY_Y, JOY_R, 0, 6.2832); ctx.fill();
  PX(ctx, JOY_X - 1, JOY_Y - JOY_R + 2, 2, 5, "rgba(255,255,255," + (0.25 * fade).toFixed(2) + ")");
  PX(ctx, JOY_X - 1, JOY_Y + JOY_R - 7, 2, 5, "rgba(255,255,255," + (0.25 * fade).toFixed(2) + ")");
  ctx.fillStyle = "rgba(255,217,74," + (0.34 * fade).toFixed(2) + ")";
  ctx.beginPath(); ctx.arc(JOY_X + joy.dx*16, JOY_Y + joy.dy*16, 14, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(255,235,160," + (0.6 * fade).toFixed(2) + ")"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(JOY_X + joy.dx*16, JOY_Y + joy.dy*16, 14, 0, 6.2832); ctx.stroke();
  // right action cluster
  var btns = [["拳", btnAtk], ["腳", btnKick], ["跳", btnJump]];
  for (var i=0;i<btns.length;i++){
    var b = btns[i][1];

    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = b.on ? "rgba(255,235,150,0.9)" : "rgba(255,255,255,0.32)";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.stroke();
    TXT(btns[i][0], b.x, b.y - 9, 15, b.on ? "#1a1408" : "#fff", "center", true);
  }
  // mobile hint for the new combined move: dark chip keeps it legible over
  // the bright shop signs it sits in front of.
  var hintX = W - 116 - SAFE.r, hintY = 122 + SAFE.t;
  ROUND(ctx, hintX - 62, hintY - 4, 124, 16, "rgba(6,8,18,0.62)", 4);

// Tappable connection panel (mobile-first). It doubles as the automatic
// "reconnecting" overlay when a network drop is detected.
function netMenuRows(){
  // The two info lines are drawn at y0+36 / y0+52 (y0 = 48) with a 10px
  // font, so they occupy y 82..110. Start the first button box at 116 to
  // keep the subtitle and the button label from colliding on a 270px screen.
  var first = 130, gap = 27;
  if (!NET || !NET.active) return [ { id:"full", y:first }, { id:"close", y:first+34 } ];
  return [ { id:"retry", y:first }, { id:"full", y:first+gap },
           { id:"leave", y:first+gap*2 }, { id:"close", y:first+gap*3 } ];
}
function netMenuPointer(g){
  var rows = netMenuRows();
  for (var i=0;i<rows.length;i++){
    var r = rows[i];
    if (Math.abs(g.x - W/2) > 132 || Math.abs(g.y - r.y) > 15) continue;
    if (r.id === "full"){ toggleFullscreen(); netMenu.open = false; }
    else if (r.id === "close"){ netMenu.open = false; }
    else if (r.id === "leave"){
      if (NET && NET.active) netDisconnect("已斷線");
      else netMenu.open = false;
    } else if (r.id === "retry"){
      if (NET && NET.active && NET.broken){ netExitToSelect(); return; }
      if (NET && NET.active){ netForceReconnect(); netMenu.open = false; }
      else netMenu.open = false;
    }
    SFX.swing();
    return;
  }
}

  var i;
  for (i=0;i<G.weapons.length;i++) drawWeaponGround(G.weapons[i]);
  var ents = [];
  for (i=0;i<G.players.length;i++) if (!G.players[i].removeMe) ents.push({ z: G.players[i].z, f: G.players[i] });
  for (i=0;i<G.enemies.length;i++) if (!G.enemies[i].removeMe) ents.push({ z: G.enemies[i].z, f: G.enemies[i] });
  for (i=0;i<G.props.length;i++) if (!G.props[i].dead) ents.push({ z: G.props[i].z, pr: G.props[i] });
  for (i=0;i<G.parts.length;i++) if (G.parts[i].food) ents.push({ z: G.parts[i].z, food: G.parts[i] });
  ents.sort(function(a,b){ return a.z - b.z; });
  for (i=0;i<ents.length;i++){
    var en = ents[i];
    if (en.f) drawFighter(en.f);
    else if (en.pr) drawProp(en.pr);
    else if (en.food) drawFood(en.food);

// ======================================================================
// DISCONNECT / RECONNECT  (v5)
// ----------------------------------------------------------------------
// A mobile network can vanish silently (radio handover, screen off, lift,
// captive portal). Instead of ending the round with "對方斷咗線", the
// session FREEZES and both peers dial back into the same room using the
// same session id. The relay keeps each slot for a grace period so the
// returning device can reclaim it. The host is authoritative: it sends a
// JSON snapshot of the entire deterministic game state at its current
// tick, the guest adopts it, and both sides re-stamp inputs from that
// tick. No input history needs to survive the outage, so the resumed
// lockstep is bit-exact on both devices.
// ======================================================================
var netMenu = { open: false };

function netNow(){
  return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
}
function netToast(s, ms){
  if (!NET) return;
  NET.toast = s; NET.toastUntil = netNow() + (ms || 2200);
}

// --- full game-state snapshot (host -> guest) ---
// Fighter-to-fighter references (grabTarget / grabbedBy / bossRef / player)
// are replaced with "@p0" / "@e2" tokens before JSON, then re-linked.
function netSerializeState(){
  var map = new Map();
  function token(o){
    if (!o) return null;
    if (map.has(o)) return map.get(o);
    var i, t;
    if ((i = G.players.indexOf(o)) >= 0) t = "@p" + i;
    else if ((i = G.enemies.indexOf(o)) >= 0) t = "@e" + i;
    else return null;
    map.set(o, t); return t;
  }
  function clone(o){
    var c = {};
    for (var k in o){
      var v = o[k];
      if (k === "grabTarget" || k === "grabbedBy") c[k] = token(v);
      else if (v && typeof v === "object") c[k] = JSON.parse(JSON.stringify(v));
      else c[k] = v;
    }
    return c;
  }
  var out = {};
  for (var k in G){
    var v = G[k];
    if (v === G.rng) out[k] = { s: G.rng.s >>> 0 };
    else if (k === "player") out[k] = "@p0";
    else if (k === "bossRef") out[k] = token(v);
    else if (Array.isArray(v)) out[k] = v.map(clone);
    else out[k] = v;
  }
  return JSON.stringify(out);
}
function netRestoreState(json){
  var d = JSON.parse(json), g = {}, k;
  for (k in d) g[k] = d[k];
  g.rng = new RNG(0);
  g.rng.s = (d.rng && typeof d.rng.s === "number") ? (d.rng.s >>> 0) : 1;
  function deref(v){
    if (typeof v === "string" && v.charAt(0) === "@"){
      var a = (v.charAt(1) === "p") ? g.players : g.enemies;
      return a[parseInt(v.slice(2), 10)] || null;
    }
    return v || null;
  }
  var all = (g.players || []).concat(g.enemies || []);
  for (var i=0;i<all.length;i++){
    all[i].grabTarget = deref(all[i].grabTarget);
    all[i].grabbedBy = deref(all[i].grabbedBy);
  }
  g.bossRef = deref(g.bossRef);
  g.player = g.players[0];
  return g;
}

function netResetAfterResume(sess, tick){

  sess.recs = [{}, {}];
  for (var t=tick; t<tick+INPUT_DELAY; t++){
    sess.recs[0][t] = emptyRec(t);

  }

  sess.hashMine = {}; sess.hashTheirs = {};

  sess.dropped = false; sess.resumeReply = false; sess.live = true;
  sess.ignorePeerLeftUntil = netNow() + 3000;

// Freeze without tearing anything down (used when the peer comes back on a
// socket that is still healthy on our side).
function netFreeze(sess, why){

  sess.attempts = 0; sess.retryAt = 0; sess.resumeSentAt = 0;
  sess.live = !!sess.transport;

// Hard drop: our own transport died. Close it, keep G, start the dial-back.

  if (sess.dropped) return;
  netClearTimers(sess);
  try { if (sess.transport) sess.transport.close(); } catch(e){}
  sess.transport = null;
  if (sess.conn){ try { sess.conn.close(); } catch(e){} sess.conn = null; }
  if (sess.ws){ try { sess.ws.close(); } catch(e){} sess.ws = null; }
  // a P2P host keeps its Peer id so the guest can dial straight back in;
  // a guest re-creates its (anonymous) Peer on each attempt.
  if (sess.role === "guest" && sess.peer){ try { sess.peer.destroy(); } catch(e){} sess.peer = null; }
  sess.live = false;
  sess.dropped = true; sess.dropWhy = why || "連線中斷";

  sess.transport = null;
  if (sess.ws){ try { sess.ws.close(); } catch(e){} sess.ws = null; }
  if (sess.conn){ try { sess.conn.close(); } catch(e){} sess.conn = null; }
  sess.live = false;

    }
  } catch(e){}
  setTimeout(fitCanvas, 250);
}

// ----- Cloudflare relay transport (v4.4) -----
// Both sides open a websocket to the relay worker (wss on 443 — the same
// shape as loading a web page, so it works on networks where WebRTC P2P
// can never form). A Durable Object per room code pairs host+guest and
// forwards messages; the game's hello/start handshake and lockstep
// records pass through untouched. Relay control messages arrive as
// {type:"__relay", event:"..."} and are intercepted by the adapter.
// Address resolution: baked-in RELAY_URL, overridden per device by a
// ?relay=wss://... link (persisted to localStorage) so the game can be
// pointed at a freshly deployed worker without editing the file.
var RELAY_URL = "wss://dragon-alley-relay.ccac-church.workers.dev/ws";
function relayBase(){
  try { var s = localStorage.getItem("da-relay-url"); if (s) return s; } catch(e){}
  if (QS_RELAY) return QS_RELAY;
  return RELAY_URL;
}
function netWsTransport(sess, ws){
  sess.ws = ws;
  sess.transport = {
    send: function(obj){ try { if (ws.readyState === 1) ws.send(JSON.stringify(obj)); } catch(e){} },
    onmessage: null,
    close: function(){ try { ws.close(); } catch(e){} }
  };
  sess.transport.onmessage = function(obj){ if (NET === sess) netHandleMessage(obj); };
  ws.onmessage = function(ev){
    var msg = null;
    try { msg = JSON.parse(ev.data); } catch(e){ return; }
    if (msg && msg.type === "__relay"){ netRelayEvent(sess, msg.event); return; }
    if (sess.transport && sess.transport.onmessage) sess.transport.onmessage(msg);
  };
  ws.onclose = function(){
    if (NET !== sess || sess.ws !== ws) return;
    sess.ws = null;
    if (sess.dropped){
      // a reconnect attempt failed: go straight to the next backoff round
      sess.live = false;
      sess.retryAt = Math.min(sess.retryAt, netNow() + 300);
    } else netHandleDrop(sess, "連線中斷");
  };
  ws.onerror = function(){ /* a close event follows */ };
}
// sid lets the relay recognise a RETURNING device and hand its old slot
// back during the grace window instead of answering "room full".
function relayUrl(sess, resume){
  var base = relayBase();
  return base + (base.indexOf("?") >= 0 ? "&" : "?") +
    "room=" + encodeURIComponent(sess.code) + "&role=" + sess.role +
    "&sid=" + encodeURIComponent(sess.sid) + (resume ? "&resume=1" : "");
}
function netRelayEvent(sess, event){
  if (NET !== sess) return;
  // ---- live game: never fail the lobby, just keep reconnecting ----
  if (sess.active){
    if (event === "peer-left"){
      if (sess.dropped || netNow() < sess.ignorePeerLeftUntil) return;
      netHandleDrop(sess, "對方斷咗線");
    } else if (event === "paired" || event === "guest-joined" || event === "peer-resumed"){
      if (sess.dropped && sess.live) netSendResume(sess);
    } else if (event === "no-host" || event === "waiting-host"){
      LOBBY.status = "等緊對方返嚟…";
    }
    // room-full / room-taken during a drop just means the other device has
    // not released its slot yet; the backoff loop tries again.
    return;
  }
  if (event === "no-host") netFail(sess, "typing", "房間唔存在（中繼）— 等主機開咗房先");
  else if (event === "room-full") netFail(sess, "typing", "間房已經有客人入咗");
  else if (event === "room-taken"){
    // another host holds this code on the relay: fresh code, retry
    if (sess.role === "host" && LOBBY.state === "hostWait" && (sess.retry || 0) < 8){
      sess.retry = (sess.retry || 0) + 1;
      sess.code = netGenCode(); LOBBY.code = sess.code; sess.ws = null;
      netRelayConnect(sess);
    } else netFail(sess, "menu", "開房失敗（代碼撞咗），再試下");
  }
  else if (event === "peer-left") netPeerGone();
  // "paired" / "guest-joined" are informational: the hello/start
  // handshake over the pipe drives everything from here.
}
function netRelayConnect(sess){
  var ws;
  try { ws = new WebSocket(relayUrl(sess, false)); }
  catch(e){ netFail(sess, sess.role === "host" ? "menu" : "typing", "中繼連線失敗，再試下"); return; }
  netWsTransport(sess, ws);
  ws.onopen = function(){
    if (NET !== sess) return;
    netClearTimers(sess);
    sess.live = true;
    if (sess.role === "host"){ if (!sess.active) LOBBY.status = "等朋友入房…"; }
    else {
      sess.transport.send({ type: "hello", code: sess.code, sid: sess.sid });
      LOBBY.status = "已連通（中繼），等主機開始…";
      netArmTimer(sess, 10000, function(){
        netFail(sess, "typing", "主機冇回應 — 等主機嗰邊重新開房再試");
      });
    }
  };
}
// Dial back into the room with the SAME sid. The relay holds the slot for a
// grace window; a "room-full"/"no-host" reply just costs one backoff round.
function netRelayResumeConnect(sess){
  var ws;
  try { ws = new WebSocket(relayUrl(sess, true)); }
  catch(e){ return; }
  netWsTransport(sess, ws);
  ws.onopen = function(){
    if (NET !== sess) return;
    netClearTimers(sess);
    sess.live = true;
    netSendResume(sess);
  };
}
function netRelayReady(sess, failState){
  if (relayBase()) return true;
  netFail(sess, failState, "中繼未設定網址：先部署 Cloudflare Worker，再用 ?relay= 連結開一次本頁，或者將網址俾 Muse 入落遊戲");
  return false;
}
function netRelayHostStart(sess){
  LOBBY.state = "hostWait"; LOBBY.status = "① 開房中（連緊中繼）…";
  if (!netRelayReady(sess, "menu")) return;
  sess.mode = "relay";
  netArmTimer(sess, 12000, function(){
    netFail(sess, "menu", "開房失敗：連唔到中繼（等咗 12 秒）— 檢查網絡同中繼網址");
  });
  netRelayConnect(sess);
}
function netRelayGuestJoin(sess){
  LOBBY.state = "joining"; LOBBY.status = "① 連緊中繼…";
  if (!netRelayReady(sess, "typing")) return;
  sess.mode = "relay";
  netArmTimer(sess, 12000, function(){
    netFail(sess, "typing", "連唔到中繼（等咗 12 秒）— 檢查網絡同中繼網址");
  });
  netRelayConnect(sess);
}

// ----- session setup: host -----
function netHostStart(){
  NET = newNetSession("host");
  var sess = NET;
  NET.code = netGenCode();
  LOBBY.code = NET.code;
  LOBBY.state = "hostWait"; LOBBY.status = "① 開房中（連緊信令服務）…";
  if (QS_NETTEST){
    netAttachBC(sess);
    LOBBY.status = "等朋友入房…（本機測試模式）";
    return;
  }
  if (LOBBY.mode === "relay"){ netRelayHostStart(sess); return; }
  if (!peerAvailable()){
    LOBBY.state = "menu"; LOBBY.status = "連線組件載入失敗，線上雙打用唔到（本地模式不受影響）";
    NET = null;
    return;
  }
  netPeerHostOpen(sess);
}
function netHostConnReset(sess, conn){
  // a guest's direct connection died before the game started: drop that
  // conn only and keep the room open for another attempt
  if (NET !== sess || sess.active) return;
  if (sess.conn !== conn) return;
  sess.conn = null; sess.transport = null;
  try { conn.close(); } catch(e){}
  LOBBY.status = "頭先嗰個直連失敗咗，繼續等朋友入房…";
}
function netPeerHostOpen(sess){
  netClearTimers(sess);
  if (sess.peer){ try { sess.peer.destroy(); } catch(e){} sess.peer = null; }
  var peer;
  try { peer = new window.Peer(PEER_PREFIX + sess.code, { config: ICE_CONFIG }); } catch(e){
    LOBBY.state = "menu"; LOBBY.status = "開房失敗，再試下"; netCloseTransport(); NET = null; return;
  }
  sess.peer = peer;
  netArmTimer(sess, 12000, function(){
    netFail(sess, "menu", "開房失敗：連唔到信令服務（等咗 12 秒）— 檢查網絡；要用 Chrome/Safari 開，唔好喺通訊 app 入面開");
  });
  peer.on("open", function(){
    if (NET !== sess) return;
    netClearTimers(sess);
    if (!sess.active) LOBBY.status = "等朋友入房…";
  });
  peer.on("disconnected", function(){
    if (NET !== sess) return;
    try { peer.reconnect(); } catch(e){}
    if (sess.active){ netHandleDrop(sess, "信令斷線"); return; }
    LOBBY.status = "信令斷咗，重連中…";
    netArmTimer(sess, 10000, function(){
      netFail(sess, "menu", "開房失敗：信令重連唔到 — 檢查網絡再試");
    });
  });
  peer.on("connection", function(conn){ netAcceptP2PConn(sess, conn); });
  peer.on("error", function(err){
    if (NET !== sess) return;
    var t = (err && err.type) ? err.type : "";
    if (t === "unavailable-id" && ++sess.retry <= 3){
      sess.code = netGenCode(); LOBBY.code = sess.code;
      netPeerHostOpen(sess);
    } else {
      LOBBY.state = "menu"; LOBBY.status = "開房失敗（" + t + "），再試下";
      netCloseTransport(); NET = null;
    }
  });
}

// ----- P2P reconnect: the host keeps its Peer id, the guest dials again -----
function netAcceptP2PConn(sess, conn){
  if (NET !== sess){ try { conn.close(); } catch(e){} return; }
  var replacing = !!(sess.active && sess.dropped);
  if (sess.conn && !replacing){ try { conn.close(); } catch(e){} return; }
  if (sess.conn){ try { sess.conn.close(); } catch(e){} }
  sess.conn = conn;
  netPeerTransport(sess, conn);
  LOBBY.status = replacing ? "對方返緊嚟…" : "有朋友連緊入嚟…";
  conn.on("data", function(d){ if (sess.transport) sess.transport.onmessage(d); });
  conn.on("open", function(){
    if (NET === sess && sess.active && sess.dropped){ sess.live = true; netSendResume(sess); }
  });
  conn.on("close", function(){
    if (sess.active){ if (!sess.dropped && NET === sess) netHandleDrop(sess, "對方斷咗線"); }
    else netPeerGone();
  });
  conn.on("error", function(){
    if (sess.active){ if (!sess.dropped && NET === sess) netHandleDrop(sess, "直連中斷"); }
    else netHostConnReset(sess, conn);
  });
  conn.on("iceStateChanged", function(st){
    if (st !== "failed") return;
    if (sess.active){ if (!sess.dropped && NET === sess) netHandleDrop(sess, "直連中斷"); }
    else netHostConnReset(sess, conn);
  });
}
function netP2PResumeConnect(sess){
  if (!peerAvailable()) return;
  if (sess.role === "host"){
    // the Peer id IS the room code: keep it so the guest can dial back in
    if (!sess.peer || sess.peer.disconnected){
      try { if (sess.peer) sess.peer.destroy(); } catch(e){}
      try {
        var hp = new window.Peer(PEER_PREFIX + sess.code, { config: ICE_CONFIG });
        sess.peer = hp;
        hp.on("connection", function(conn){ netAcceptP2PConn(sess, conn); });
        hp.on("disconnected", function(){ try { hp.reconnect(); } catch(e){} });
        hp.on("error", function(){});
      } catch(e){ sess.peer = null; }
    }
    return;
  }
  try { if (sess.peer) sess.peer.destroy(); } catch(e){}
  sess.peer = null;
  var peer;
  try { peer = new window.Peer({ config: ICE_CONFIG }); } catch(e){ return; }
  sess.peer = peer;
  peer.on("open", function(){
    if (NET !== sess || !sess.dropped) return;
    var conn;
    try { conn = peer.connect(PEER_PREFIX + sess.code, { reliable: true }); } catch(e){ return; }
    sess.conn = conn;
    netPeerTransport(sess, conn);
    conn.on("data", function(d){ if (sess.transport) sess.transport.onmessage(d); });
    conn.on("open", function(){ if (NET === sess){ sess.live = true; netSendResume(sess); } });
    conn.on("close", function(){
      if (NET === sess && sess.dropped){ sess.live = false; sess.retryAt = Math.min(sess.retryAt, netNow() + 300); }
    });
    conn.on("error", function(){
      if (NET === sess && sess.dropped){ sess.live = false; sess.retryAt = Math.min(sess.retryAt, netNow() + 300); }
    });
  });
  peer.on("error", function(){ if (NET === sess && sess.dropped) sess.live = false; });
}

// ----- session setup: guest -----
function netGuestJoin(){
  var code = (LOBBY.typed || "").toUpperCase();
  if (code.length !== 6){ LOBBY.status = "代碼要 6 個字"; return; }
  NET = newNetSession("guest");
  var sess = NET;
  sess.code = code; LOBBY.code = code;
  LOBBY.state = "joining"; LOBBY.status = "① 連緊信令服務…";
  if (QS_NETTEST){
    netAttachBC(sess);
    sess.transport.send({ type: "hello", code: code, sid: sess.sid });
    LOBBY.status = "等主機回應…（本機測試模式）";
    return;
  }
  if (LOBBY.mode === "relay"){ netRelayGuestJoin(sess); return; }
  if (!peerAvailable()){
    LOBBY.state = "menu"; LOBBY.status = "連線組件載入失敗，線上雙打用唔到（本地模式不受影響）";
    NET = null;
    return;
  }
  var peer;
  try { peer = new window.Peer({ config: ICE_CONFIG }); } catch(e){
    LOBBY.state = "menu"; LOBBY.status = "連接失敗，再試下"; NET = null; return;
  }
  sess.peer = peer;
  netArmTimer(sess, 12000, function(){
    netFail(sess, "menu", "連唔到信令服務（等咗 12 秒）— 檢查網絡；要用 Chrome/Safari 開，唔好喺通訊 app 入面開");
  });
  peer.on("open", function(){
    if (NET !== sess) return;
    netClearTimers(sess);
    LOBBY.status = "② 信令 OK，直連緊主機…";
    var conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    sess.conn = conn;
    netPeerTransport(sess, conn);
    netArmTimer(sess, 20000, function(){
      netFail(sess, "typing", "直連唔到主機（等咗 20 秒）— 多數係網絡擋住咗直連：兩部機試下用同一個 WiFi，兩邊螢幕保持開住、停留喺遊戲畫面再試");
    });
    conn.on("open", function(){
      if (NET !== sess) return;
      netClearTimers(sess);
      sess.live = true;
      sess.transport.send({ type: "hello", code: code, sid: sess.sid });
      LOBBY.status = "③ 已連通，等主機開始…";
      netArmTimer(sess, 10000, function(){
        netFail(sess, "typing", "主機冇回應 — 等主機嗰邊重新開房再試");
      });
    });
    conn.on("data", function(d){ if (sess.transport) sess.transport.onmessage(d); });
    conn.on("close", function(){ if (sess.active) netHandleDrop(sess, "對方斷咗線"); else netPeerGone(); });
    conn.on("error", function(err){
      if (sess.active){ netHandleDrop(sess, "直連中斷"); return; }
      var t = (err && err.type) ? err.type : "";
      netFail(sess, "typing", "直連失敗（" + t + "）— 兩部機試下用同一個 WiFi 再試");
    });
    conn.on("iceStateChanged", function(st){
      if (st !== "failed") return;
      if (sess.active) netHandleDrop(sess, "直連中斷");
      else netFail(sess, "typing", "直連失敗（網絡擋住咗）— 兩部機試下用同一個 WiFi，兩邊螢幕保持開住再試");
    });
  });
  peer.on("disconnected", function(){
    if (NET !== sess) return;
    if (sess.active){ netHandleDrop(sess, "信令斷線"); return; }
    netFail(sess, "menu", "信令斷咗線 — 檢查網絡再試");
  });
  peer.on("error", function(err){
    if (NET !== sess) return;
    if (sess.active){ netHandleDrop(sess, "信令中斷"); return; }
    var t = (err && err.type) ? err.type : "";
    if (t === "peer-unavailable") netFail(sess, "typing", "房間唔存在，檢查代碼再試");
    else netFail(sess, "menu", "連接失敗（" + t + "），再試下");
  });
}

// ----- message handling / game start -----
function netHandleMessage(msg){
  if (!NET || !msg || !msg.type) return;
  NET.lastPong = netNow();                 // any packet proves the link is alive
  if (msg.type === "ping"){
    if (NET.transport){ try { NET.transport.send({ type: "pong", q: msg.q, ts: msg.ts }); } catch(e){} }
    return;
  }
  if (msg.type === "pong"){
    if (typeof msg.ts === "number") NET.pingMs = Math.max(0, Math.round(netNow() - msg.ts));
    return;
  }
  // ---- reconnect handshake ----
  if (msg.type === "resume"){
    if (!NET.active || NET.role !== "host" || NET.broken) return;
    if (msg.code && msg.code !== NET.code) return;
    if (NET.remoteSid && msg.sid && msg.sid !== NET.remoteSid) return;
    if (!NET.dropped) netFreeze(NET, "對方重新連線");
    if (!NET.transport) return;
    // authoritative snapshot: the guest replaces its whole sim with this
    try {
      NET.transport.send({ type: "state", code: NET.code, seed: NET.seed,
        tick: G.tick, snap: netSerializeState() });
    } catch(e){}
    return;
  }
  if (msg.type === "state"){
    if (!NET.active || NET.role !== "guest" || !NET.dropped || NET.broken) return;
    if (msg.code && msg.code !== NET.code) return;
    if (typeof msg.snap !== "string") return;
    var restored;
    try { restored = netRestoreState(msg.snap); } catch(e){ return; }
    G = restored;
    if (typeof msg.seed === "number") NET.seed = msg.seed;
    var t = G.tick;
    if (NET.transport){
      try { NET.transport.send({ type: "resumed", code: NET.code, tick: t, sid: NET.sid }); } catch(e){}
    }
    netResetAfterResume(NET, t);
    return;
  }
  if (msg.type === "resumed"){
    if (!NET.active || NET.role !== "host" || !NET.dropped || NET.broken) return;
    netResetAfterResume(NET, G.tick);
    return;
  }
  if (msg.type === "hello"){
    if (NET.role !== "host" || NET.active || LOBBY.state !== "hostWait") return;
    if (msg.code && msg.code !== NET.code){
      NET.transport.send({ type: "reject" });
      return;
    }
    if (msg.sid) NET.remoteSid = msg.sid;
    netHostBegin();
  }
  else if (msg.type === "reject"){
    if (NET.role === "guest" && LOBBY.state === "joining"){
      netCloseTransport(); NET = null;
      LOBBY.state = "typing"; LOBBY.status = "代碼唔啱，再輸入過";
    }
  }
  else if (msg.type === "start"){
    if (NET.role === "guest" && !NET.active && typeof msg.seed === "number") netStartGame(msg.seed);
  }
  else if (msg.type === "input"){
    if (NET.active && msg.rec && typeof msg.rec.t === "number"){
      if (!NET.recs[NET.remoteIdx][msg.rec.t]) NET.recs[NET.remoteIdx][msg.rec.t] = msg.rec;
    }
  }
  else if (msg.type === "hash"){
    NET.hashTheirs[msg.tick] = msg.h;
    netCheckHash(msg.tick);
  }
  else if (msg.type === "bye"){ netPeerGone(); }
}
function netHostBegin(){
  // the session seed is generated ONCE here, outside the sim (wall clock
  // is allowed for this), and transmitted to the guest — the sim itself
  // only ever sees the agreed seed.
  var seed = ((Date.now() % 1000000007) ^ ((performance.now() * 1000) >>> 0) ^ 0x5eed1234) >>> 0;
  if (!seed) seed = 20261110;
  NET.seed = seed;
  NET.transport.send({ type: "start", seed: seed });
  netStartGame(seed);
}
function netStartGame(seed){
  netClearTimers(NET);
  // the relay adds a network hop, so its inputs get a longer runway
  // (5 ticks instead of 3) to keep stalls rare; both sides derive this
  // from their own session's transport mode, so they always agree.
  INPUT_DELAY = (NET.mode === "relay") ? 5 : 3;
  NET.active = true;
  NET.live = true; NET.dropped = false; NET.broken = false;
  NET.lastPing = netNow(); NET.lastPong = netNow();
  NET.seed = seed;
  NET.recs = [{}, {}];
  for (var t=0;t<INPUT_DELAY;t++){ NET.recs[0][t] = emptyRec(t); NET.recs[1][t] = emptyRec(t); }
  NET.nextTick = INPUT_DELAY;
  NET.stallFrames = 0; NET.stalled = false; NET.desync = false; NET.broken = false;
  NET.hashMine = {}; NET.hashTheirs = {};
  stagePins = [makeStagePin(), makeStagePin()];
  G = newGame(seed, { mode: "2P", chars: ["ahLong", "ahFu"] });
  G.phase = "fight";
  startWave(0);
  resetInputState(true);
  SFX.go();
}
function netPeerGone(){
  if (!NET) return;
  // an explicit "bye" means the other player QUIT (not a network fault):
  // there is nobody to reconnect to, so show the end-of-session overlay.
  if (NET.active){ NET.broken = true; netMenu.open = true; return; }
  if (!G || G.phase !== "lobby") return;
  if (NET.role === "host" && LOBBY.state === "hostWait"){
    NET.conn = null;
    LOBBY.status = "對方離開咗，繼續等朋友入房…";
  } else if (NET.role === "guest" && LOBBY.state === "joining"){
    netCloseTransport(); NET = null;
    LOBBY.state = "menu"; LOBBY.status = "主機斷咗線";
  }
}
function netExitToSelect(){ netDisconnect(""); }

// ----- lockstep core -----
// Once per rendered frame: stamp the local live channel into records for
// upcoming ticks and send them. Presses are read-and-cleared from the live
// edgeBuf exactly once, onto the first record produced this frame.
function netSample(){
  if (!NET || !NET.active || !NET.transport) return;
  if (G.phase !== "fight" && G.phase !== "go") return;
  var target = G.tick + INPUT_DELAY;
  if (NET.nextTick > target) return;
  var capP = edgeBuf.punch > 0, capK = edgeBuf.kick > 0, capJ = edgeBuf.jump > 0;
  edgeBuf.punch = 0; edgeBuf.kick = 0; edgeBuf.jump = 0;
  var first = true;
  while (NET.nextTick <= target){
    var rec = { t: NET.nextTick,
      l: { up: !!input.up, down: !!input.down, left: !!input.left, right: !!input.right },
      p: { punch: first && capP, kick: first && capK, jump: first && capJ } };
    NET.recs[NET.myIdx][rec.t] = rec;
    NET.transport.send({ type: "input", rec: rec });
    NET.nextTick++;
    first = false;
  }
}

function readSafeInsets(){
  var out = { l:0, r:0, t:0, b:0 }, el = document.getElementById("safe-probe");
  if (el && window.getComputedStyle){
    var cs = getComputedStyle(el);
    out.l = parseFloat(cs.paddingLeft) || 0;  out.r = parseFloat(cs.paddingRight) || 0;
    out.t = parseFloat(cs.paddingTop) || 0;   out.b = parseFloat(cs.paddingBottom) || 0;

}
function portraitNow(){
  var aw = window.innerWidth || 1, ah = window.innerHeight || 1;

}
function updateRotateHint(){
  if (!document.body) return;
  var coarse = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || touchMode;
  document.body.classList.toggle("need-rotate",
    PORTRAIT_HINT && !ROTATE_DISMISSED && coarse && portraitNow());
}
function fitCanvas(){
  var wrap = document.getElementById("wrap");
  var ins = readSafeInsets();
  var aw = (wrap ? wrap.clientWidth : 0) || window.innerWidth || BASE_W;
  var ah = (wrap ? wrap.clientHeight : 0) || window.innerHeight || BASE_H;
  if (aw < 2 || ah < 2) return;
  // Wide landscape phones (19.5:9 / 20:9) get a WIDER logical playfield,
  // so the spare width shows more alley rather than black pillars.
  var aspect = aw / ah;
  W = Math.max(W_MIN, Math.min(W_MAX, Math.round(H * Math.max(aspect, 16/9))));
  VIEW_SCALE = Math.min(aw / W, ah / H);

  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  cv.style.width  = Math.floor(W * VIEW_SCALE) + "px";
  cv.style.height = Math.floor(H * VIEW_SCALE) + "px";
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  // CSS px -> logical units for notch / home-indicator safe areas
  SAFE.l = ins.l / VIEW_SCALE; SAFE.r = ins.r / VIEW_SCALE;
  SAFE.t = ins.t / VIEW_SCALE; SAFE.b = ins.b / VIEW_SCALE;

}

// ---------- main loop: fixed timestep, decoupled render ----------
var fixedSeed = 20261110;      // run seed; __game.start(seed) / UI restart use it unless changed
G = newGame(fixedSeed);
selApply();
var acc = 0, lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  var dtMs = ts - lastTs; lastTs = ts;
  if (dtMs > 250) dtMs = 250;
  // a physically-held button is a press LEVEL: arm the buffer once when the
  // level first appears (holding never re-arms; releasing clears the level)
  if (input.punch && !frame._pWas) edgeBuf.punch = BUF_TICKS;
  if (input.kick && !frame._kWas) edgeBuf.kick = BUF_TICKS;
  if (input.jump && !frame._jWas){
    // a jump tap can complete inside a single rendered frame at low fps
    // (the button's pointerup may even reach the sim via stepTicks before
    // any frame() runs) — honour the direct pressEdge from the input layer
    // and only top the buffer up here for keyboard-style holds.
    if (edgeBuf.jump <= 0) edgeBuf.jump = BUF_TICKS;
  }
  frame._pWas = !!input.punch; frame._kWas = !!input.kick; frame._jWas = !!input.jump;
  pressTrack();
  netHeartbeat(ts);
  netReconnectTick(ts);
  // Freeze the deterministic sim while a link is down: no sampling, no
  // stepping, no accumulated time debt. The host's snapshot on reconnect
  // therefore describes a tick both peers can agree on.
  var netFrozen = !!(NET && NET.active && (NET.dropped || NET.broken));
  if (NET && NET.active && !netFrozen) netSample();
  if (netFrozen) acc = 0; else acc += dtMs / 1000;
  var n = 0;
  while (acc >= STEP && n < 6){
    // action edges are derived from edgeBuf inside simStep (buffered,
    // consumed by playerStep) — nothing to clear here.
    if (botOn && (G.phase === "fight" || G.phase === "go")){ botDrive(); }
    if (NET && NET.active && (G.phase === "fight" || G.phase === "go")){
      // lockstep gate: never step a tick until BOTH players' records for
      // it are held. Stall instead (and drop the frame's time debt, so a
      // slow peer cannot build up a catch-up burst).
      if (!netCanStep()){
        NET.stallFrames++;
        if (NET.stallFrames > 30) NET.stalled = true;
        acc = 0;
        break;
      }
      NET.stallFrames = 0; NET.stalled = false;
      netApplyTick(G.tick);
      simStep(STEP);
      netAfterStep();
    } else {
      simStep(STEP);
    }
    acc -= STEP; n++;
  }
  if (n === 6) acc = 0;
  // render jitter for shake (visual only, not in sim)
  shakeX = G.shake > 0 ? ((G.tick * 7919) % 5 - 2) * (G.shake / 3) : 0;
  shakeY = G.shake > 0 ? ((G.tick * 104729) % 5 - 2) * (G.shake / 3) : 0;
  ctx.setTransform(RS, 0, 0, RS, shakeX * RS, shakeY * RS);
  render();
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  bgmTick();
}
fitCanvas();
requestAnimationFrame(frame);

// ---------- test hooks ----------
function resetInputState(keepHeld){
