// ---------- deterministic PRNG (mulberry32) ----------

var BELT_TOP = 178, BELT_BOT = 252;            // walkable depth band (world y = ground line)
var WORLD_LEN = 2600;                          // total stage length (px)
var GRAV = 1500, JUMP_V = 560;
var STEP = 1/60;

// input state: produced by keyboard/touch, consumed by sim.

var edgeBuf = { punch: 0, kick: 0, jump: 0 };

// ---------- online play (v4) ----------
// Lockstep over a message transport (PeerJS cloud by default; a

// INPUT_DELAY: a local input sampled now is stamped for tick now+DELAY, so

var INPUT_DELAY = 3;

// ---------- audio (WebAudio synth, starts on first gesture) ----------

  crack:  function(){ noiseBurst(0.06, 0.30, 3200); beep(1800, 0.05, "square", 0.08, 900); },

var LEAD = [220,0,262,220, 0,196,0,0, 175,0,196,175, 0,165,0,0,

// ---------- characters ----------
var HEROES = {
  ahLong: { name: "阿龍", kind: "hero",  speedMul: 1.00, dmgMul: 1.00, comboMul: 1.00 },
  ahFu:   { name: "阿虎", kind: "hero2", speedMul: 1.14, dmgMul: 0.85, comboMul: 0.82 }

// ---------- game state ----------
var G = null;
function newGame(seed, cfg){

  var chars = cfg.chars || ["ahLong"];
  var g = {
    rng: new RNG(seed),
    phase: "title",        // title | select | fight | go | clear | over
    tick: 0, time: 0,
    cam: 0, camTarget: 0,
    wave: 0,               // 0..3 (3 = boss)
    gate: 300,             // world x where current gate sits

    goTimer: 0, clearTimer: 0,

    msg: ""

  g.players.push(makePlayer(0, chars[0] || "ahLong", 80, 215));
  if (mode === "2P") g.players.push(makePlayer(1, chars[1] || "ahFu", 46, 232));

}

  var hc = HEROES[charId];

  p.idx = idx; p.charId = charId;
  p.hp = 100; p.maxhp = 100;
  p.speed = Math.round(TYPES.hero.speed * hc.speedMul);
  return p;
}

// ---------- fighters ----------
var TYPES = {
  hero:   { hp:100, speed:105, w:16, h:40, dmg:1 },
  hero2:  { hp:100, speed:105, w:16, h:40, dmg:1 },
  brawler:{ hp:30,  speed:52,  w:16, h:38, dmg:6 },
  carrier:{ hp:24,  speed:62,  w:15, h:38, dmg:5 },
  brute:  { hp:80,  speed:36,  w:22, h:46, dmg:10 },
  boss:   { hp:260, speed:44,  w:26, h:52, dmg:12 }
};
function makeFighter(kind, x, z){
  var t = TYPES[kind];
  return {
    kind: kind, x: x, z: z, y: 0, vy: 0, face: 1,
    hp: t.hp, maxhp: t.hp, speed: t.speed, w: t.w, h: t.h, dmg: t.dmg,
    state: "idle", tState: 0, atkT: 0, combo: 0, comboWin: 0,
    vx: 0, vz: 0, flash: 0, invuln: 0, dead: false, removeMe: false,
    weapon: null, aiT: 0, aiMode: "approach", thinkT: 0,

}
var WAVES = [
  { gate: 760,  list: [["brawler", 840, 205, null], ["brawler", 900, 235, null], ["carrier", 960, 215, "bat"]] },
  { gate: 1420, list: [["brawler", 1520, 225, null], ["carrier", 1580, 200, "knife"], ["brawler", 1640, 240, null], ["carrier", 1700, 215, "whip"]] },
  { gate: 2050, list: [["brute", 2160, 220, null], ["brawler", 2240, 200, null], ["brawler", 2300, 240, null], ["carrier", 2360, 215, "knife"]] },
  { gate: 2560, list: [["boss", 2450, 218, null], ["brawler", 2360, 240, null]] }

// per-wave pacing: how many enemies may be winding up / attacking at once
var WAVE_TOKENS = [1, 2, 2, 99];
function startWave(n){
  G.wave = n;
  var wv = WAVES[n];
  G.gate = wv.gate;
  G.atkTokens = WAVE_TOKENS[n];
  for (var i=0;i<wv.list.length;i++){
    var s = wv.list[i];
    var e = spawnEnemy(s[0], s[1], s[2], s[3]);
    if (G.wave === 0 && s[0] !== "boss") e.dmg = Math.max(3, e.dmg - 2); // wave-1 onboarding: softer hits
    if (s[0] === "boss") G.bossRef = e;

    var extra = [["brawler", wv.gate - 80, 232], ["carrier", wv.gate - 40, 200],

    var ex = spawnEnemy(extra[0], extra[1], extra[2], null);
    if (G.wave === 0) ex.dmg = Math.max(3, ex.dmg - 2);

// ---------- props & pickups ----------
var FOOD_TYPES = ["燒賣", "叉燒包"];
// pre-placed per gate in stage data: deterministic (no runtime RNG for placement)
var PROPS_PER_WAVE = [
  [ { x: 350, z: 196, t: "crate" }, { x: 560, z: 240, t: "crate" } ],                                 // wave 1 gates
  [ { x: 1000, z: 204, t: "bin" }, { x: 1230, z: 238, t: "crate" } ],                                 // wave 2 gates
  [ { x: 1620, z: 198, t: "crate" }, { x: 1860, z: 242, t: "bin" }, { x: 1740, z: 220, t: "crate" } ],// wave 3 gates
  [ { x: 2220, z: 192, t: "crate" }, { x: 2320, z: 248, t: "bin" } ]                                  // boss gate edges only
];
function placeProps(wave){
  G.props = [];
  var list = PROPS_PER_WAVE[wave] || [];
  for (var i=0;i<list.length;i++)
    G.props.push({ x: list[i].x, z: list[i].z, t: list[i].t, hp: 3, dead: false });

function breakProp(pr){
  pr.dead = true;
  spawnDust(pr.x, pr.z, 5);

  // lands when at least one hero is unarmed (spec) — otherwise it becomes
  // food, which is always useful.
  var r = G.rng.next();
  var unarmed = false;
  for (var ui=0;ui<G.players.length;ui++) if (!G.players[ui].weapon && !G.players[ui].dead) unarmed = true;
  if (r < 0.55 || (r < 0.80 && !unarmed)){
    G.parts.push({ food: true, label: G.rng.chance(0.5) ? FOOD_TYPES[0] : FOOD_TYPES[1],
      x: pr.x, z: pr.z, y: 0, vx: 0, vy: 0, life: 9999, t: 0, s: 8 });
  } else if (r < 0.80){
    var types = ["bat", "knife", "whip"];
    var wt = types[G.rng.int(0, 2)];

  }

}

function dropWeapon(f){
  if (!f.weapon) return;
  G.weapons.push({ type: f.weapon.type, dur: f.weapon.dur, x: f.x + f.face*6, z: f.z, y: 0, vy: 120, vx: f.face*40, spin: 0 });

  if (target.grabbedBy){ target.grabbedBy.grabTarget = null; target.grabbedBy = null; }
  spawnDust(target.x, target.z, 2);
  if (target.hp <= 0 || opts.knockdown){

    target.vx = kx; target.vy = 260; target.y = 0.01;

      vx: G.rng.range(-25,25), vy: G.rng.range(15,50), life: G.rng.range(0.25,0.5), t: 0, s: G.rng.range(1.5,3) });

// Per-player input channel: P1 uses the global input/edgeBuf (keyboard arrows+
// JKL / touch); P2 has its own channel. Both are part of the sim input
// structure — the lockstep foundation for online play.

// records — never from the live local channel directly.

    set: function(o){ for (var k in o){

  // knocked down / airborne physics
  if (p.state === "down"){
    p.y += p.vy * dt; p.vy -= GRAV * dt;
    p.x += p.vx * dt; p.vx *= 0.86;
    if (p.y <= 0 && p.vy < 0){ p.y = 0; p.vy = -p.vy * 0.35; if (Math.abs(p.vy) < 60){ p.vy = 0; } }
    if (p.tState > 0.85){
      if (p.dead){
        // co-op: stay down until the gate changes (respawn handled in simStep)
        if (!(G.mode === "2P" && otherAlive(p))) p.removeMe = true;
      }
      else { p.state = "idle"; p.tState = 0; p.invuln = 0.5; }
    }
    return;
  }
  if (p.y > 0 || p.state === "jump"){
    p.y += p.vy * dt; p.vy -= GRAV * dt;
    p.x += p.vx * dt; p.z += p.vz * dt;
    if (p.y <= 0){ p.y = 0; p.state = "idle"; p.tState = 0; spawnDust(p.x, p.z, 3); }
    if (p.state === "jumpatk" && p.y <= 0){ p.state = "idle"; }
    clampBelt(p);
    // jump attack: punch/kick pressed mid-air (consumes the buffered edge)
    if (p.y > 0 && p.state === "jump" && (ED.punchP || ED.kickP)){
      var jk = ED.punchP ? "punch" : "kick";
      if (jk === "punch") EB.punch = 0; else EB.kick = 0;
      startPlayerAttack(p, jk);
    }
    return;
  }
  if (p.state === "hurt"){
    p.x += p.vx * dt; p.vx *= 0.8;
    if (p.tState > 0.25){ p.state = "idle"; p.tState = 0; }
    return;
  }
  if (p.state === "attack"){
    var durA = (p.atkKind === "kick") ? 0.34 : 0.26;
    if (p.tState >= durA){ p.state = "idle"; p.tState = 0; }
    return;
  }
  if (p.state === "dash"){
    p.x += p.face * 230 * dt;
    // dash-attack connects when passing through an enemy
    if (!p.hitDone){ p.hitDone = true; doAttackHit(p, 17, 12, 6, p.face * 240, true); }
    if (p.tState > 0.22){ p.state = "idle"; p.tState = 0; }
    clampBelt(p); return;
  }
  if (p.state === "grab"){
    var gt = p.grabTarget;
    if (!gt || gt.dead || gt.state === "down"){ p.state = "idle"; p.grabTarget = null; if (gt) gt.grabbedBy = null; return; }
    gt.x = p.x + p.face * 14; gt.z = p.z; gt.face = -p.face;
    if (ED.punchP){
      EB.punch = 0;
      p.atkKind = "knee"; p.tState = 0;
      var cm = HEROES[p.charId].comboMul;
      hurt(gt, Math.max(1, Math.round(4 * HEROES[p.charId].dmgMul)), 0, { stun: 0.5 });
      G.score += 20; G.hitstop = 0.05; SFX.kick();
      p.combo++;
      if (p.combo >= Math.max(2, Math.round(3 * cm))){
        hurt(gt, 6, p.face * 260, { knockdown: true });
        gt.grabbedBy = null; p.grabTarget = null; p.state = "idle"; p.combo = 0;
        G.score += 50;
      }
    }
    if (ED.kickP){
      EB.kick = 0;
      hurt(gt, 6, p.face * 330, { knockdown: true });
      gt.grabbedBy = null; p.grabTarget = null; p.state = "idle"; p.combo = 0;
      G.score += 50; SFX.kick();
    }
    if (p.tState > 2.2){ gt.grabbedBy = null; p.grabTarget = null; p.state = "idle"; }
    return;
  }

  // --- free movement / actions from idle ---
  var mx = (IN.right?1:0) - (IN.left?1:0);
  var mz = (IN.down?1:0) - (IN.up?1:0);
  if (mx !== 0) p.face = mx;
  // dash: double-tap left/right tracked per player
  var pv = p.prevLv || (p.prevLv = { left:false, right:false });
  if (IN.right && !pv.right) tapDir(1, p);
  if (IN.left && !pv.left) tapDir(-1, p);
  pv.right = IN.right; pv.left = IN.left;
  if (p.dashReq){
    p.dashReq = false; p.state = "dash"; p.tState = 0; p.hitDone = false;
    SFX.swing();
    return;
  }
  p.x += mx * p.speed * dt;
  p.z += mz * p.speed * 0.72 * dt;
  if (mx !== 0 || mz !== 0){ p.state = "walk"; p.walkPh += dt * 9; } else p.state = "idle";
  clampBelt(p);

  if (ED.jumpP){
    EB.jump = 0;
    p.state = "jump"; p.tState = 0; p.y = 0.01; p.vy = JUMP_V;
    p.vx = mx * p.speed * 1.25; p.vz = mz * 40;
    return;
  }
  if (ED.punchP){
    EB.punch = 0;
    // pickup first if standing on a weapon and unarmed
    if (!p.weapon && tryPickup(p)) return;
    startPlayerAttack(p, "punch");
    return;
  }
  if (ED.kickP){
    EB.kick = 0;
    startPlayerAttack(p, "kick");
    return;
  }
  // walk-over food pickup (any grounded idle/walk state)
  tryFood(p);
}
function tapDir(d, p){
  var lt = p.lastTap || (p.lastTap = { dir: 0, t: -9 });
  var now = G.time;
  if (lt.dir === d && (now - lt.t) >= 0 && (now - lt.t) < 0.28) p.dashReq = true;
  lt.dir = d; lt.t = now;
}
function clampBelt(f){
  if (f.z < BELT_TOP) f.z = BELT_TOP;
  if (f.z > BELT_BOT) f.z = BELT_BOT;
  if (f.x < 12) f.x = 12;
  var maxX = (G && (G.phase === "fight")) ? G.gate : WORLD_LEN;
  if (f.x > maxX) f.x = maxX;
}
function tryPickup(p){
  for (var i=0;i<G.weapons.length;i++){
    var w = G.weapons[i];
    if (w.y <= 0 && Math.abs(w.x - p.x) < 16 && Math.abs(w.z - p.z) < 10){
      p.weapon = { type: w.type, dur: w.dur };
      G.weapons.splice(i,1);
      SFX.pickup();
      return true;
    }
  }
  return false;
}
var WEAPON_STATS = {
  bat:   { reach: 24, dmg: 9,  dur: 8 },
  knife: { reach: 20, dmg: 8,  dur: 6 },
  whip:  { reach: 34, dmg: 6,  dur: 10 }
};
function startPlayerAttack(p, kind){
  p.state = "attack"; p.tState = 0; p.atkKind = kind; p.hitDone = false;
  if (p.y > 0) p.state = "jumpatk";
  var hc = HEROES[p.charId] || HEROES.ahLong;
  if (kind === "punch"){
    if (p.weapon){
      var ws = WEAPON_STATS[p.weapon.type];
      doAttackHit(p, ws.reach, 12, ws.dmg, p.face * 170, false);
      if (p.weapon.type === "whip") SFX.crack(); else SFX.swing();
      wearWeapon(p);
    } else {
      p.combo = (p.comboWin > 0) ? p.combo + 1 : 1;
      if (p.combo > 3) p.combo = 1;
      p.comboWin = 0.55 * hc.comboMul;
      var kd = (p.combo === 3);
      doAttackHit(p, 17, 10, Math.max(1, Math.round((kd ? 7 : 5) * hc.dmgMul)), p.face * (kd ? 250 : 120), kd);
      SFX.swing();
    }
  } else { // kick
    doAttackHit(p, 21, 11, Math.max(1, Math.round(7 * hc.dmgMul)), p.face * 260, false);
    SFX.swing();
  }
  // grab check: unarmed punch at very close range vs standing enemy -> grab attempt happens in hit resolution
}
function wearWeapon(p){
  p.weapon.dur--;
  if (p.weapon.dur <= 0){ p.weapon = null; SFX.down(); }
}
function weaponOf(e){ return e.weapon; }

// resolve an attacker's strike: players hit enemies AND breakable props;
// enemies hit players (friendly fire OFF — players never hit each other).
function doAttackHit(atk, reach, zTol, dmg, kx, knockdown){
  var isPlayer = atk.idx !== undefined;
  var targets = isPlayer ? G.enemies : G.players;
  var hitAny = false;
  for (var i=0;i<targets.length;i++){
    var t = targets[i];
    if (t.dead || t.state === "down") continue;
    if (Math.abs(t.y - atk.y) > 26) continue;
    var dx = (t.x - atk.x) * atk.face;
    if (dx < -4 || dx > reach + t.w/2) continue;
    if (Math.abs(t.z - atk.z) > zTol + 4) continue;
    // grab: player unarmed punch, very close, enemy standing
    if (isPlayer && !atk.weapon && atk.atkKind === "punch" && dx < 13 && t.state !== "attack" && atk.y === 0){
      t.grabbedBy = atk; atk.grabTarget = t; atk.state = "grab"; atk.tState = 0; atk.combo = 0;
      t.state = "grabbed"; t.tState = 0;
      hitAny = true; break;
    }
    var heavy = (t.kind === "brute" || t.kind === "boss") && !knockdown && dmg < 8;
    var ok = hurt(t, dmg, heavy ? kx * 0.25 : kx, { knockdown: knockdown && !heavy, stun: 0.28 });
    if (ok){
      hitAny = true;
      if (isPlayer){
        G.score += 30;
        G.hitstop = Math.max(G.hitstop, knockdown ? 0.07 : 0.045);
        if (t.dead) G.score += 100;
      }
    }
  }
  // player attacks also break props in range
  if (isPlayer && atk.y === 0){
    for (var j=0;j<G.props.length;j++){
      var pr = G.props[j];
      if (pr.dead) continue;
      var pdx = (pr.x - atk.x) * atk.face;
      if (pdx < -6 || pdx > reach + 10) continue;
      if (Math.abs(pr.z - atk.z) > zTol + 8) continue;
      pr.hp -= 1;
      spawnDust(pr.x, pr.z, 2);
      G.hitstop = Math.max(G.hitstop, 0.03);
      if (pr.hp <= 0) breakProp(pr);
      hitAny = true;
    }
  }
  return hitAny;
}

// ---------- targeting helpers ----------
function nearestPlayer(e){
  var best = null, bd = 1e9;
  for (var i=0;i<G.players.length;i++){
    var q = G.players[i];
    if (q.dead) continue;
    var d = Math.abs(q.x - e.x) + Math.abs(q.z - e.z);
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}
function otherAlive(p){
  for (var i=0;i<G.players.length;i++) if (G.players[i] !== p && !G.players[i].dead) return true;
  return false;
}
// attack-token gate: only G.atkTokens enemies may be in windup/attack at once
function tokensUsed(except){
  var n = 0;
  for (var i=0;i<G.enemies.length;i++){
    var o = G.enemies[i];
    if (o !== except && o.state === "attack") n++;
  }
  return n;
}

// ---------- enemy update ----------
function enemyStep(e, dt){
  var p = nearestPlayer(e) || G.player;
  e.tState += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.invuln > 0) e.invuln -= dt;
  if (e.throwCd > 0) e.throwCd -= dt;

  if (e.state === "down"){
    e.y += e.vy * dt; e.vy -= GRAV * dt;
    e.x += e.vx * dt; e.vx *= 0.86;
    if (e.y <= 0 && e.vy < 0){ e.y = 0; e.vy = -e.vy * 0.35; if (Math.abs(e.vy) < 60) e.vy = 0; }
    if (e.tState > 0.8){
      if (e.dead){ e.removeMe = true; }
      else { e.state = "idle"; e.tState = 0; e.invuln = 0.7; }
    }
    return;
  }
  if (e.state === "grabbed"){
    if (!e.grabbedBy){ e.state = "idle"; e.tState = 0; }
    return;
  }
  if (e.state === "hurt"){
    e.x += e.vx * dt; e.vx *= 0.8;
    if (e.tState > 0.28){ e.state = "idle"; e.tState = 0; }
    return;
  }
  if (e.state === "attack"){
    var windup = (G.wave === 0) ? 0.30 : 0.22;
    if (!e.hitDone && e.tState > windup){
      e.hitDone = true;
      var reach = (e.kind === "brute" || e.kind === "boss") ? 26 : 18;
      doAttackHit(e, reach, 11, e.dmg, e.face * 180, e.chargeAtk === true);
    }
    if (e.tState > windup + 0.23){ e.state = "idle"; e.tState = 0; e.chargeAtk = false; }
    return;
  }
  if (e.state === "charge"){
    e.x += e.face * 200 * dt;
    if (!e.hitDone){
      for (var ci=0;ci<G.players.length;ci++){
        var cp = G.players[ci];
        if (!cp.dead && Math.abs(cp.x - e.x) < 20 && Math.abs(cp.z - e.z) < 12 && cp.y < 20){
          e.hitDone = true;
          hurt(cp, e.dmg, e.face * 260, { knockdown: true });
          break;
        }
      }
    }
    if (e.tState > 0.42){ e.state = "idle"; e.tState = 0; }
    clampBelt(e); return;
  }
  if (e.stun > 0){ e.stun -= dt; e.state = "idle"; return; }
  if (!nearestPlayer(e)) { e.state = "idle"; return; }

  // --- simple AI ---
  e.thinkT -= dt;
  var dx = p.x - e.x, dz = p.z - e.z;
  var adx = Math.abs(dx), adz = Math.abs(dz);
  e.face = dx >= 0 ? 1 : -1;
  if (e.thinkT <= 0){
    e.thinkT = G.rng.range(0.25, 0.55);
    var r = G.rng.next();
    if (adx < 90 && r < 0.18) e.aiMode = "circle";
    else if (r < 0.08) e.aiMode = "retreat";
    else e.aiMode = "approach";
    e.aiT = G.rng.range(0.4, 1.0);
  }
  if (e.aiT > 0) e.aiT -= dt; else e.aiMode = "approach";

  // knife thrower behaviour
  if (e.kind === "carrier" && e.weapon && e.weapon.type === "knife" && e.throwCd <= 0 && adx > 90 && adx < 200 && adz < 8 && G.rng.chance(0.012)){
    G.weapons.push({ type: "knife", dur: 3, x: e.x, z: e.z, y: 22, vy: 0, vx: e.face * 240, spin: 1, thrown: true });
    e.weapon = null; e.throwCd = 3;
    SFX.swing();
  }

  var inRange = adx < ((e.kind === "brute" || e.kind === "boss") ? 24 : 17) && adz < 9 && p.y < 14;
  if (inRange && e.invuln <= 0 && (e.kind === "boss" || tokensUsed(e) < G.atkTokens)){
    var atkChance = (e.kind === "boss") ? 0.05 : 0.035;
    if (G.rng.chance(atkChance)){
      e.state = "attack"; e.tState = 0; e.hitDone = false;
      e.chargeAtk = false;
      SFX.swing();
      return;
    }
  }
  // brute/boss shoulder charge from mid range
  if ((e.kind === "brute" || e.kind === "boss") && adx > 55 && adx < 110 && adz < 8 && e.invuln <= 0 && G.rng.chance(e.kind === "boss" ? 0.014 : 0.008)){
    e.state = "charge"; e.tState = 0; e.hitDone = false;
    SFX.swing();
    return;
  }
  var sp = e.speed;
  var mvx = 0, mvz = 0;
  if (e.aiMode === "approach"){
    if (adx > 13) mvx = Math.sign(dx) * sp;
    if (adz > 4) mvz = Math.sign(dz) * sp * 0.7;
  } else if (e.aiMode === "circle"){
    mvz = (Math.sin(G.time * 1.7 + e.seedOff) > 0 ? 1 : -1) * sp * 0.55;
    if (adx > 30) mvx = Math.sign(dx) * sp * 0.6;
  } else if (e.aiMode === "retreat"){
    mvx = -Math.sign(dx) * sp * 0.7;
  }
  e.x += mvx * dt; e.z += mvz * dt;
  if (mvx !== 0 || mvz !== 0){ e.state = "walk"; e.walkPh += dt * 8; } else e.state = "idle";
  clampBelt(e);
  // keep enemies from stacking exactly
  for (var j=0;j<G.enemies.length;j++){
    var o = G.enemies[j];
    if (o !== e && !o.dead && Math.abs(o.x - e.x) < 10 && Math.abs(o.z - e.z) < 6) e.x += (e.x < o.x ? -8 : 8) * dt;
  }
}

// thrown weapons / loose weapons physics
function weaponStep(dt){
  for (var i=G.weapons.length-1;i>=0;i--){
    var w = G.weapons[i];
    if (w.thrown){
      w.x += w.vx * dt; w.spin += dt * 18;
      var hitP = null;
      for (var pi=0;pi<G.players.length;pi++){
        var pp = G.players[pi];
        if (!pp.dead && Math.abs(pp.x - w.x) < 10 && Math.abs(pp.z - w.z) < 8 && pp.y < 26 && pp.state !== "down"){ hitP = pp; break; }
      }
      if (hitP){
        hurt(hitP, 5, Math.sign(w.vx) * 160, {});
        G.weapons.splice(i,1); continue;
      }
      if (w.x < G.cam - 40 || w.x > G.cam + W + 60){ G.weapons.splice(i,1); continue; }
    } else if (w.y > 0 || w.vy !== 0){
      w.y += w.vy * dt; w.vy -= GRAV * dt; w.x += (w.vx || 0) * dt; w.vx *= 0.9;
      if (w.y <= 0){ w.y = 0; w.vy = 0; w.vx = 0; }
    }
  }
}

// food pickup: walk over a dropped food item to eat it (+25 HP, capped)
function tryFood(p){
  if (p.dead || p.y > 0) return;
  for (var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    if (!q.food) continue;
    if (Math.abs(q.x - p.x) < 14 && Math.abs(q.z - p.z) < 9){
      G.parts.splice(i,1);
      p.hp = Math.min(p.maxhp, p.hp + 25);
      addFloat(p.x, p.z, "+25", "#7ae0a3");
      SFX.pickup();
      return;
    }
  }
}

// derive one player's action edges from their press buffer for this step
function deriveEdges(pin){
  pin.edge.punchP = pin.buf.punch > 0;
  pin.edge.kickP = pin.buf.kick > 0;
  pin.edge.jumpP = pin.buf.jump > 0;
  if (pin.buf.punch > 0) pin.buf.punch--;
  if (pin.buf.kick > 0) pin.buf.kick--;
  if (pin.buf.jump > 0) pin.buf.jump--;
}
function allPlayersDead(){
  for (var i=0;i<G.players.length;i++) if (!G.players[i].dead) return false;
  return true;
}
// co-op: a downed player comes back when the arena clears (fight->go)
// or the next wave starts, with half HP — as long as a partner is alive
function respawnCheck(){
  if (G.mode !== "2P") return;
  if (G.phase !== "go" && G.phase !== "fight") return;
  for (var i=0;i<G.players.length;i++){
    var q = G.players[i];
    if (q.dead && otherAlive(q)){
      q.dead = false; q.removeMe = false;
      q.hp = Math.floor(q.maxhp / 2);
      var alive = null;
      for (var j=0;j<G.players.length;j++) if (!G.players[j].dead && G.players[j] !== q) alive = G.players[j];
      q.x = alive ? Math.max(14, alive.x - 30) : 80;
      q.z = alive ? alive.z : 215;
      q.y = 0; q.vy = 0; q.vx = 0; q.state = "idle"; q.tState = 0; q.invuln = 1.0;
      q.weapon = null; q.grabTarget = null; q.grabbedBy = null;
      addFloat(q.x, q.z, "復活！", "#8ad2ff");
    }
  }
}

// ---------- main sim step ----------
function simStep(dt){
  // derive this step's action edges from the press buffers (single source:
  // buffers are armed by input producers, ticked down here, and zeroed by
  // playerStep when actually consumed — so a press survives hitstop and
  // busy states instead of being silently dropped).
  var pin1 = getPin(G.players[0]);
  deriveEdges(pin1);
  var pin2 = (G.mode === "2P" && G.players[1]) ? getPin(G.players[1]) : null;
  if (pin2) deriveEdges(pin2);
  if (G.phase === "title" || G.phase === "clear" || G.phase === "over"){
    G.tick++;
    if (input.startP || uiStartFlag){
      uiStartFlag = false;
      var seed2 = fixedSeed;
      G = newGame(seed2, { mode: G.selMode, chars: G.selMode === "2P" ? ["ahLong", "ahFu"] : [selIdx === 1 ? "ahFu" : "ahLong"] });
      G.phase = "fight";
      startWave(0);
      SFX.go();
    }
    input.startP = false;
    return;
  }
  if (G.phase === "select"){ G.tick++; selectStep(); return; }
  if (G.phase === "lobby"){ G.tick++; return; }
  if (paused && !(NET && NET.active)) return;
  G.tick++; G.time += dt;
  if (G.hitstop > 0){ G.hitstop -= dt; decayFx(dt);
    // keep direction levels in sync so a held direction is not mistaken
    // for a fresh double-tap when hitstop ends (playerStep also mirrors
    // levels into each player's own prevLv every step)
    prevInput.left = input.left; prevInput.right = input.right;
    prevInput.up = input.up; prevInput.down = input.down;
    return; }

  for (var pi=0;pi<G.players.length;pi++) playerStep(G.players[pi], dt);
  var p = leadPlayer();
  prevInput.punch = input.punch; prevInput.kick = input.kick; prevInput.jump = input.jump;
  prevInput.left = input.left; prevInput.right = input.right;
  prevInput.up = input.up; prevInput.down = input.down;

  for (var i=G.enemies.length-1;i>=0;i--){
    var e = G.enemies[i];
    enemyStep(e, dt);
    if (e.removeMe) G.enemies.splice(i,1);
  }
  weaponStep(dt);
  respawnCheck();

  // particles + floaters
  decayFx(dt);
  for (var fi=G.floats.length-1;fi>=0;fi--){
    var fl = G.floats[fi]; fl.t += dt;
    if (fl.t > fl.life) G.floats.splice(fi,1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 14);

  // camera follows the lead (leftmost living) player, clamped to the gate.
  // Moves toward the target at a fixed per-step rate (frame-count based,
  // not exponential) so replays are bit-exact.
  var want = p.x - 150;
  var maxCam = (G.phase === "fight") ? (G.gate - W + 60) : (WORLD_LEN - W);
  if (want > maxCam) want = maxCam;
  if (want < 0) want = 0;
  if (want < G.cam) want = G.cam; // never scroll back
  var cd = want - G.cam;
  var cStep = 320 * dt;
  if (cd > cStep) G.cam += cStep; else if (cd < -cStep) G.cam -= cStep; else G.cam = want;
  if (G.cam > WORLD_LEN - W) G.cam = WORLD_LEN - W;

  // wave clear?
  if (G.phase === "fight" && G.enemies.length === 0){
    if (G.wave >= 3){
      G.phase = "clear"; G.clearTimer = 0; SFX.clear();
      var nb = 0;
      for (var bi=0;bi<G.players.length;bi++) if (!G.players[bi].dead) nb += Math.floor(G.players[bi].hp) * 10;
      nb += Math.max(0, 600 - Math.floor(G.time)) * 2;
      if (nb > 0) G.score += nb;
    } else {
      G.phase = "go"; G.goTimer = 0; SFX.go();
    }
  }
  if (G.phase === "go"){
    G.goTimer += dt;
    respawnCheck();
    // a living player walks past old gate -> trigger next wave in its zone
    var next = WAVES[G.wave + 1];
    if (next){
      for (var gi=0;gi<G.players.length;gi++){
        if (!G.players[gi].dead && G.players[gi].x > next.gate - 330){ startWave(G.wave + 1); break; }
      }
    }
  }
  if (G.phase === "clear") G.clearTimer += dt;
  if (allPlayersDead()){
    if (G.phase !== "over"){ G.phase = "over"; SFX.over(); }
  }
}
function leadPlayer(){
  var best = null;
  for (var i=0;i<G.players.length;i++){
    var q = G.players[i];
    if (q.dead) continue;
    if (!best || q.x < best.x) best = q;
  }
  return best || G.players[0];
}
function decayFx(dt){
  for (var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    if (q.food){ continue; } // food pickups rest on the ground until eaten
    q.t += dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 300 * dt;
    if (q.y < 0) q.y = 0;
    if (q.t > q.life) G.parts.splice(i,1);
  }
}

// ---------- rendering ----------
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

function R(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x|0, y|0, Math.ceil(w), Math.ceil(h)); }
function TXT(s, x, y, size, color, align, bold){
  ctx.fillStyle = color;
  ctx.font = (bold ? "bold " : "") + size + "px 'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif";
  ctx.textAlign = align || "left"; ctx.textBaseline = "top";
  ctx.fillText(s, x, y);
}
function shadow(x, z, w){
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.beginPath(); ctx.ellipse(x, z + 3, w * 0.62, 3.4, 0, 0, 6.2832); ctx.fill();
}

// pixel character drawing: all procedural rects.
// pose: idle|walk|attack|kick|hurt|down|jump... f.walkPh animates legs.
function drawFighter(f){
  var sx = Math.round(f.x - G.cam);
  var gy = Math.round(f.z);                 // ground screen y
  var sy = gy - Math.round(f.y);            // body base y (jump raises)
  if (sx < -70 || sx > W + 70) return;      // off-screen cull (boss spawns ahead of camera)
  var face = f.face;
  var flash = f.flash > 0;
  var C;
  if (f.kind === "hero")        C = { skin:"#f0c08a", hair:"#22242e", top:"#d33f2e", top2:"#a82a1e", pants:"#2b3a67", shoes:"#f2f2f2", belt:"#ffd94a" };
  else if (f.kind === "hero2")  C = { skin:"#e8b078", hair:"#5a3410", top:"#1f9d8f", top2:"#14706a", pants:"#5b2a6e", shoes:"#ffd94a", belt:"#ffffff" };
  else if (f.kind === "brawler")C = { skin:"#d99a5f", hair:"#101010", top:"#3f7a3a", top2:"#2c5528", pants:"#4a3423", shoes:"#222", belt:"#888" };
  else if (f.kind === "carrier")C = { skin:"#f0c8a0", hair:"#7a1f3d", top:"#7a2d8f", top2:"#5a1f6a", pants:"#22242e", shoes:"#c22", belt:"#ddd" };
  else if (f.kind === "brute")  C = { skin:"#c98a54", hair:"#000", top:"#28418c", top2:"#1a2c5f", pants:"#333", shoes:"#111", belt:"#c9a227" };
  else /* boss */               C = { skin:"#e0aa72", hair:"#3a3a3a", top:"#15151c", top2:"#000", pants:"#1c1c26", shoes:"#000", belt:"#ffd94a" };
  if (flash){ for (var k in C) C[k] = "#ffffff"; }

  var big = (f.kind === "brute" || f.kind === "boss");
  var u = big ? 1.22 : 1.0;                 // scale unit
  var bw = Math.round(13 * u), bh = f.h;    // body width / height
  var legSwing = (f.state === "walk") ? Math.round(Math.sin(f.walkPh) * 3) : 0;
  var down = (f.state === "down");
  shadow(sx, gy, bw + 4);
  ctx.save();
  ctx.translate(sx, sy);
  if (down){
    // lying body
    R(-bw, -5, bw * 2, 5, C.pants);
    R(-bw - 4 * face, -8, bw + 2, 6, C.top);
    R((face > 0 ? -bw - 11 : bw + 3), -8, 8, 7, C.skin); // head
    R((face > 0 ? -bw - 11 : bw + 3), -9, 8, 3, C.hair);
    ctx.restore();
    drawNameHp(f, sx, gy - bh - 8);
    return;
  }
  var bodyTop = -bh;
  // legs
  var legH = Math.round(bh * 0.38);
  R(-bw/2 + 1 + legSwing, -legH, 4.6 * u, legH, C.pants);
  R(bw/2 - 5.6 * u - legSwing, -legH, 4.6 * u, legH, C.pants);
  R(-bw/2 + legSwing, -3, 5.6 * u, 3, C.shoes);
  R(bw/2 - 5.6 * u - legSwing, -3, 5.6 * u, 3, C.shoes);
  // torso
  R(-bw/2, bodyTop + Math.round(bh*0.34), bw, Math.round(bh*0.30), C.top);
  R(-bw/2, bodyTop + Math.round(bh*0.34), bw, 3, C.top2);
  R(-bw/2, -legH - 2, bw, 3, C.belt);
  // head
  var hd = Math.round(bh * 0.24);
  R(-hd/2, bodyTop, hd, hd, C.skin);
  R(-hd/2, bodyTop, hd, Math.round(hd*0.38), C.hair);
  if (f.kind === "boss"){ R(-hd/2, bodyTop + hd + 1, hd, 3, "#ffd94a"); } // gold chain-ish collar
  if (f.kind === "carrier"){ R(face * (hd/2 - 1), bodyTop + 2, 3, hd + 4, C.hair); } // long hair side
  // arms by state
  var shY = bodyTop + Math.round(bh*0.36);
  var armC = C.top2, skinC = C.skin;
  var rearArm = function(){ R(-face * (bw/2 + 2), shY, 4 * u, Math.round(bh*0.24), armC); };
  if (f.state === "attack"){
    if (f.atkKind === "kick"){
      rearArm();
      // front leg extended
      R(face * (bw/2 - 2), -legH + 2, Math.round(15 * u), 5, C.pants);
      R(face * (bw/2 + 11 * u), -legH + 2, 6, 5, C.shoes);
    } else if (f.atkKind === "knee"){
      rearArm();
      R(face * (bw/2 - 1), -legH - 6, 6, 10, C.pants);
    } else {
      // punch / weapon swing: front arm extended
      var ext = f.weapon ? WEAPON_STATS[f.weapon.type].reach : 13;
      R(face * (bw/2 - 1), shY + 1, face * ext * 0.55, 4.4 * u, armC);
      var hx = face * (bw/2 + ext * 0.55);
      if (f.weapon) drawWeaponInHand(f.weapon.type, hx, shY + 3, face, flash);
      else R(hx - 2, shY, 5, 5, skinC);
      R(-face * (bw/2 + 1), shY + 3, 4 * u, Math.round(bh*0.2), armC);
    }
  } else if (f.state === "dash" || f.state === "charge"){
    R(face * (bw/2 - 1), shY + 2, face * 11, 4.4 * u, armC);      // shoulder forward
    R(-face * (bw/2 + 1), shY + 2, 4 * u, Math.round(bh*0.2), armC);
  } else if (f.state === "hurt" || f.state === "grabbed"){
    R(-face * (bw/2 + 2), shY - 3, 4 * u, Math.round(bh*0.2), armC);
    R(face * (bw/2 - 1), shY - 3, 4 * u, Math.round(bh*0.2), armC);
  } else if (f.state === "grab"){
    R(face * (bw/2 - 1), shY + 1, face * 10, 4.4 * u, armC);
    R(face * (bw/2 - 1), shY + 7, face * 9, 4.4 * u, armC);
  } else {
    // idle / walk arms
    var sw = (f.state === "walk") ? Math.round(Math.sin(f.walkPh) * 2) : 0;
    R(-face * (bw/2 + 1) , shY, 4 * u, Math.round(bh*0.26), armC);
    R(face * (bw/2 - 3), shY + sw, 4 * u, Math.round(bh*0.26), armC);
    if (f.weapon){
      var hx2 = face * (bw/2 + 1);
      drawWeaponInHand(f.weapon.type, hx2, shY + Math.round(bh*0.26), face, flash);
    }
  }
  ctx.restore();
  if (f.state === "charge") { /* dust */ }
  drawNameHp(f, sx, gy - bh - 8 - Math.round(f.y));
}
function drawNameHp(f, sx, y){
  if (f.idx !== undefined || f.kind === "boss") return; // players use the HUD bars
  if (f.dead) return;
  var w = 22;
  R(sx - w/2 - 1, y - 1, w + 2, 4, "rgba(0,0,0,0.55)");
  R(sx - w/2, y, w * Math.max(0, f.hp / f.maxhp), 2, "#e5484d");
}
function drawWeaponInHand(type, x, y, face, flash){
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  var c1 = flash ? "#fff" : null;
  if (type === "bat"){ R(0, -2, 15, 4, c1 || "#b07a3f"); R(13, -3, 4, 6, c1 || "#96622c"); }
  else if (type === "knife"){ R(0, -1, 4, 3, c1 || "#6b4a2a"); R(4, -2, 10, 3, c1 || "#d9dee6"); }
  else if (type === "whip"){ ctx.fillStyle = c1 || "#8a5a2a"; ctx.fillRect(0, -1, 20, 2); ctx.fillRect(18, 0, 6, 2); }
  ctx.restore();
}
function drawWeaponGround(w){
  var sx = Math.round(w.x - G.cam), sy = Math.round(w.z - w.y);
  shadow(sx, w.z, 12);
  ctx.save(); ctx.translate(sx, sy - 2);
  if (w.thrown) ctx.rotate(w.spin);
  if (w.type === "bat"){ R(-8, -2, 16, 4, "#b07a3f"); R(6, -3, 4, 6, "#96622c"); }
  else if (w.type === "knife"){ R(-7, -1, 4, 3, "#6b4a2a"); R(-3, -2, 10, 3, "#d9dee6"); }
  else { ctx.fillStyle = "#8a5a2a"; ctx.fillRect(-9, -1, 15, 2); ctx.fillRect(4, 0, 5, 2); ctx.fillRect(-11, -2, 3, 4); }
  ctx.restore();
}

// background: original night street, parallax layers
function drawBG(){
  // sky
  var grd = ctx.createLinearGradient(0, 0, 0, BELT_TOP);
  grd.addColorStop(0, "#141a35"); grd.addColorStop(1, "#2c2a4a");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, BELT_TOP + 4);
  R(392, 18, 26, 26, "#e8e4c8"); R(398, 14, 14, 14, "#f4f0d8"); // moon
  // far skyline (slow parallax)
  var off1 = Math.floor(G.cam * 0.25);
  ctx.fillStyle = "#1d2340";
  for (var i = -1; i < 9; i++){
    var bx = i * 74 - (off1 % 74), bh = 52 + ((i * 37 + ((off1 / 74)|0) * 13) % 40);
    ctx.fillRect(bx, BELT_TOP - bh - 26, 62, bh + 26);
    ctx.fillStyle = "#3d4a7a";
    for (var wy = 0; wy < 4; wy++) for (var wx = 0; wx < 4; wx++)
      if ((i * 7 + wy * 3 + wx * 5) % 4 === 0) ctx.fillRect(bx + 6 + wx * 14, BELT_TOP - bh - 18 + wy * 16, 6, 8);
    ctx.fillStyle = "#1d2340";
  }
  // shopfront row (mid parallax)
  var off2 = Math.floor(G.cam * 0.6);
  var shops = [
    { w: 120, c: "#4a2f2a", sign: "茶餐廳", sc: "#ffd94a" },
    { w: 96,  c: "#2c3a4e", sign: "大藥房", sc: "#7ae0a3" },
    { w: 110, c: "#3d2c46", sign: "電玩城", sc: "#ff8ac2" },
    { w: 100, c: "#2e4238", sign: "雲吞麵", sc: "#ffb35c" },
    { w: 116, c: "#46352a", sign: "唱片行", sc: "#8ad2ff" }
  ];
  var sx = -(off2 % 542);
  var idx = Math.floor(off2 / 542);
  for (var s = -1; s < 4; s++){
    var sh = shops[((idx + s) % shops.length + shops.length) % shops.length];
    var x = sx + s * 118;
    R(x, 74, 112, BELT_TOP - 74, sh.c);
    R(x, 74, 112, 4, "#10101c");
    R(x + 8, 84, 62, 20, "#14141f");
    TXT(sh.sign, x + 11, 88, 13, sh.sc, "left", true);
    R(x + 8, 112, 44, BELT_TOP - 112, "#0f0f18");            // doorway
    R(x + 58, 112, 46, BELT_TOP - 112, "#23202c");           // window
    R(x + 58, 112, 46, 3, "#3a3648");
    R(x, BELT_TOP - 6, 112, 6, "#191922");                    // kerb shadow
  }
  // belt (road + pavement)
  R(0, BELT_TOP, W, H - BELT_TOP, "#33323e");
  R(0, BELT_TOP, W, 5, "#454354");
  R(0, BELT_BOT + 6, W, H - BELT_BOT - 6, "#26252e");
  // lane dashes scroll with world
  ctx.fillStyle = "#5a5870";
  var dashOff = Math.floor(G.cam) % 46;
  for (var d = -1; d < 12; d++) ctx.fillRect(d * 46 - dashOff, 226, 24, 3);
  // lamps tied to world coords (backdrop, above the belt)
  drawLamps();
}
var LAMPS = [700, 1330, 2380];
function drawLamps(){
  for (var i=0;i<LAMPS.length;i++){
    var sx = Math.round(LAMPS[i] - G.cam);

}
// breakable props for the current gate area, drawn on the belt (z-sorted later is overkill; belt-level y draw)
function drawProp(pr){
  var sx = Math.round(pr.x - G.cam), gy = Math.round(pr.z);
  if (sx < -30 || sx > W + 30) return;
  shadow(sx, gy, 16);
  if (pr.t === "crate"){
    R(sx - 9, gy - 15, 18, 15, pr.hp < 3 ? "#7d5a33" : "#6e5230");
    R(sx - 9, gy - 15, 18, 3, "#86663c"); R(sx - 1, gy - 15, 2, 15, "#59401f");
    if (pr.hp === 1){ R(sx - 5, gy - 11, 9, 2, "#3a2a12"); }
  } else {
    R(sx - 7, gy - 17, 13, 17, pr.hp < 3 ? "#486a52" : "#3d5a44");
    R(sx - 8, gy - 19, 15, 3, "#2c4433");
    if (pr.hp === 1){ R(sx - 4, gy - 13, 7, 2, "#22392a"); }
  }
}
function drawFood(q){

function drawHUD(){

function drawTouch(){
  if (!touchMode) return;
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  // fixed-base joystick + knob (knob follows the held offset)
  ctx.beginPath(); ctx.arc(JOY_X, JOY_Y, JOY_R, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(JOY_X + joy.dx * 16, JOY_Y + joy.dy * 16, 13, 0, 6.2832);
  ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fill();
  var btns = [["拳", btnAtk], ["腳", btnKick], ["跳", btnJump]];
  for (var i=0;i<btns.length;i++){
    var b = btns[i][1];
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.fillStyle = b.on ? "rgba(255,217,74,0.45)" : "rgba(255,255,255,0.12)";
    ctx.fill(); ctx.stroke();
    TXT(btns[i][0], b.x, b.y - 8, 14, "#fff", "center", true);
  }
}
var joy = { dx: 0, dy: 0, id: -1 };
var JOY_X = 62, JOY_Y = 200, JOY_R = 30;
var btnAtk = { x: 424, y: 210, r: 24, hit: 34, on: false, id: -1 };
var btnKick = { x: 372, y: 230, r: 22, hit: 32, on: false, id: -1 };
var btnJump = { x: 448, y: 158, r: 22, hit: 32, on: false, id: -1 };
var btnPause = { x: 452, y: 52, r: 13, hit: 22 };
var btnMute = { x: 416, y: 52, r: 13, hit: 22 };

function render(){
  ctx.save();
  if (G.shake > 0) ctx.translate(Math.round((G.rng ? 0 : 0)), 0); // shake applied below via render-only jitter
  drawBG();
  // draw order: weapons on ground, then props/food/fighters sorted by z
  var i;
  for (i=0;i<G.weapons.length;i++) drawWeaponGround(G.weapons[i]);
  var ents = [];
  for (i=0;i<G.players.length;i++) if (!G.players[i].removeMe) ents.push({ z: G.players[i].z, f: G.players[i] });
  for (i=0;i<G.enemies.length;i++) if (!G.enemies[i].removeMe) ents.push({ z: G.enemies[i].z, f: G.enemies[i] });
  for (i=0;i<G.props.length;i++) if (!G.props[i].dead) ents.push({ z: G.props[i].z, pr: G.props[i] });
  for (i=0;i<G.parts.length;i++) if (G.parts[i].food) ents.push({ z: G.parts[i].z, food: G.parts[i] });
  ents.sort(function(a,b){ return a.z - b.z; });
  for (i=0;i<ents.length;i++){
    var en = ents[i];
    if (en.f) drawFighter(en.f);
    else if (en.pr) drawProp(en.pr);
    else if (en.food) drawFood(en.food);
  }
  // particles (dust)
  for (i=0;i<G.parts.length;i++){
    var q = G.parts[i];
    if (q.food) continue;
    ctx.fillStyle = "rgba(200,190,170," + (0.5 * (1 - q.t / q.life)).toFixed(2) + ")";
    ctx.fillRect(Math.round(q.x - G.cam), Math.round(q.z - q.y), q.s, q.s);
  }
  // floaters (+25 / 復活！)
  for (i=0;i<G.floats.length;i++){
    var fl = G.floats[i];
    var a = 1 - fl.t / fl.life;
    ctx.globalAlpha = Math.max(0, a);
    TXT(fl.text, Math.round(fl.x - G.cam), Math.round(fl.z - 46 - fl.t * 18), 11, fl.color, "center", true);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawHUD();
  // online session indicators (non-blocking)
  if (NET && NET.active && !NET.broken){
    if (NET.stalled) TXT("等緊對方…", W/2, 46, 12, "#ffd94a", "center", true);
    if (NET.desync) TXT("同步出現偏差", W - 12, 40, 10, "#ff9a9a", "right");
  }
  // top-right small buttons (pause / mute) — kept clear of the score text
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.beginPath(); ctx.arc(btnPause.x, btnPause.y, btnPause.r, 0, 6.2832); ctx.fill();
  TXT(paused ? "▶" : "Ⅱ", btnPause.x, btnPause.y - 6, 11, "#fff", "center", true);
  ctx.beginPath(); ctx.arc(btnMute.x, btnMute.y, btnMute.r, 0, 6.2832); ctx.fill();
  TXT(muted ? "✕" : "♪", btnMute.x, btnMute.y - 6, 11, "#fff", "center", true);

  if (G.phase === "title"){
    R(0, 0, W, H, "rgba(5,5,16,0.72)");
    TXT("雙龍巷戰", W/2, 62, 40, "#ffd94a", "center", true);

// deterministic bot driver for balance tests (set by __game.useBot):
// replaces P1's input channel with simple approach/attack logic each step.
var botOn = false;
function botDrive(){
  var q = G.players[0], pin = pinForTest(0);
  if (q.dead){ pin.set({ up:false, down:false, left:false, right:false }); return; }
  var tgt = null, bd = 1e9;
  for (var i=0;i<G.enemies.length;i++){
    var e = G.enemies[i];
    if (e.dead || e.removeMe) continue;
    var d = Math.abs(e.x - q.x) + Math.abs(e.z - q.z);
    if (d < bd){ bd = d; tgt = e; }
  }
  if (q.hp <= 60){
    for (var j=0;j<G.parts.length;j++) if (G.parts[j].food){ tgt = G.parts[j]; break; }
  }
  var lv = { up:false, down:false, left:false, right:false };
  if (tgt){
    var dx = tgt.x - q.x, dz = tgt.z - q.z;
    if (!tgt.food && Math.abs(dx) <= 15 && Math.abs(dz) <= 7){
      if (G.tick % 17 === 0) pin.set({ punchP: true });
      else if (G.tick % 23 === 0) pin.set({ kickP: true });
    } else {
      if (dx > 4) lv.right = true; else if (dx < -4) lv.left = true;
      if (dz > 3) lv.down = true; else if (dz < -3) lv.up = true;
    }
  } else if (G.phase === "go"){ lv.right = true; }
  pin.set(lv);
}

// start-flow input: a press on the title screen goes to character select;
// a second, separate press (punch/jump button or Enter/J) confirms.
// Kept OUT of the gameplay sim: UI phases advance on rendered frames.
function pressTrack(){
  var lv = input.punch || input.kick || input.jump;
  if (lv && !pressTrack.prev){
    if (G){
      // online session: a disconnect, or any press on the clear/over
      // screens, tears the session down back to select — a local-only
      // restart would instantly desync the two peers.
      if (NET && NET.active && (NET.broken || G.phase === "clear" || G.phase === "over")) netExitToSelect();
      else if (G.phase === "title") G.phase = "select";
      else if (G.phase === "select"){ if (pressTrack.armed) selConfirm(); }
      else if (G.phase === "clear" || G.phase === "over") input.startP = true;
    }
    pressTrack.armed = true;
  }
  if (!lv) pressTrack.armed = true;
  pressTrack.prev = lv;
}
pressTrack.prev = false;
pressTrack.armed = true;

// ---------- online: lobby, transport, lockstep session ----------
// Transport interface: NET.transport = { send(obj), onmessage, close() }.
// Adapters: PeerJS cloud (default) and a BroadcastChannel loopback used
// only when the URL has ?nettest=1 (two pages, one browser — test rig).
// Messages are plain JSON-able objects:
//   hello {code} · start {seed} · input {rec} · hash {tick, h} ·
//   reject {} · bye {}
var PEER_PREFIX = "dragon-alley-matt-";
var CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
var LOBBY = { state: "menu", idx: 0, typed: "", code: "", status: "" };
var LOBBY_ROWS_Y = [108, 140, 172];
var SEL_ROWS_Y = [84, 116, 148, 180];

function peerAvailable(){ return typeof window !== "undefined" && !!window.Peer; }
function netGenCode(){
  var s = "";
  for (var i=0;i<6;i++) s += CODE_ALPHABET.charAt(Math.floor(Math.random() * CODE_ALPHABET.length));
  return s;
}
function newNetSession(role){
  return { role: role, myIdx: role === "host" ? 0 : 1, remoteIdx: role === "host" ? 1 : 0,
    active: false, code: "", seed: 0, transport: null, peer: null, conn: null, bc: null,
    recs: [{}, {}], nextTick: INPUT_DELAY, stallFrames: 0, stalled: false,
    desync: false, broken: false, hashMine: {}, hashTheirs: {}, retry: 0 };
}
function emptyRec(t){
  return { t: t, l: { up:false, down:false, left:false, right:false },
           p: { punch:false, kick:false, jump:false } };
}

// ----- lobby UI state -----
function enterLobby(){
  G.phase = "lobby";
  LOBBY.state = "menu";
  LOBBY.idx = (QS_NETTEST && QS_ROLE === "guest") ? 1 : 0;
  LOBBY.typed = ""; LOBBY.status = "";
  if (!QS_NETTEST && !peerAvailable()) LOBBY.status = "連線組件未載入，線上雙打暫時用唔到（本地模式不受影響）";
}
function lobbyConfirm(){
  if (LOBBY.state !== "menu") return;
  if (LOBBY.idx === 0) netHostStart();
  else if (LOBBY.idx === 1){
    LOBBY.state = "typing"; LOBBY.status = "";
    if (touchMode){
      var v = null;
      try { v = window.prompt("輸入房間代碼（6 個字）", LOBBY.typed || ""); } catch(e){}
      if (v !== null && v !== undefined){
        LOBBY.typed = ("" + v).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
        netGuestJoin();
      } else LOBBY.state = "menu";
    }
  }
  else netExitToSelect();
}
function lobbyBack(){
  if (LOBBY.state === "typing" && !NET){ LOBBY.state = "menu"; LOBBY.status = ""; }
  else netExitToSelect();
}
function lobbyKey(ev){
  var c = ev.code;
  if (LOBBY.state === "typing"){
    if (c === "Escape") lobbyBack();
    else if (c === "Enter") netGuestJoin();
    else if (c === "Backspace") LOBBY.typed = LOBBY.typed.slice(0, -1);
    else if (/^Key[A-Z]$/.test(c)){ if (LOBBY.typed.length < 6) LOBBY.typed += c.slice(3); }
    else if (/^Digit[0-9]$/.test(c)){ if (LOBBY.typed.length < 6) LOBBY.typed += c.slice(5); }
    return;
  }
  if (c === "Escape"){ lobbyBack(); return; }
  if (LOBBY.state === "menu"){
    if (c === "ArrowUp" || c === "KeyW"){ LOBBY.idx = (LOBBY.idx + 2) % 3; SFX.swing(); }
    else if (c === "ArrowDown" || c === "KeyS"){ LOBBY.idx = (LOBBY.idx + 1) % 3; SFX.swing(); }
    else if (c === "Enter" || c === "KeyJ" || c === "Space") lobbyConfirm();
  }
  // hostWait / joining: only Esc (handled above)
}
function lobbyPointer(g){
  if (LOBBY.state === "menu"){
    var hit = -1;
    for (var i=0;i<3;i++){ if (Math.abs(g.y - LOBBY_ROWS_Y[i]) <= 16){ hit = i; break; } }
    if (hit >= 0){
      if (LOBBY.idx === hit) lobbyConfirm();
      else { LOBBY.idx = hit; SFX.swing(); }
    }
    return;
  }
  if (LOBBY.state === "typing"){
    if (g.y >= 200) netGuestJoin();
    else if (g.y <= 60) lobbyBack();
    return;
  }
  if ((LOBBY.state === "hostWait" || LOBBY.state === "joining") && g.y <= 60) lobbyBack();
}

// ----- transport adapters -----
function netAttachBC(sess){
  var bc = new BroadcastChannel("dragon-alley-nettest");
  sess.bc = bc;
  sess.transport = {
    send: function(obj){ try { bc.postMessage({ from: sess.role, obj: obj }); } catch(e){} },
    onmessage: null,
    close: function(){ try { bc.close(); } catch(e){} }
  };
  sess.transport.onmessage = function(obj){ if (NET === sess) netHandleMessage(obj); };
  bc.onmessage = function(ev){
    var m = ev.data;
    if (!m || m.from === sess.role || !m.obj) return;
    sess.transport.onmessage(m.obj);
  };
}
function netPeerTransport(sess, conn){
  sess.transport = {
    send: function(obj){ if (conn.open) conn.send(obj); },
    onmessage: null,
    close: function(){ try { conn.close(); } catch(e){} }
  };
  sess.transport.onmessage = function(obj){ if (NET === sess) netHandleMessage(obj); };
}
// ----- connection-stage timers: every waiting stage gets a deadline, so
// a stuck connection surfaces a specific message instead of spinning on
// one status forever (Matt's 2026-11-10 report: 連接緊… with no end).
function netClearTimers(sess){
  if (!sess || !sess.timers) return;
  for (var i=0;i<sess.timers.length;i++) clearTimeout(sess.timers[i]);
  sess.timers = [];
}
function netArmTimer(sess, ms, fn){
  if (!sess.timers) sess.timers = [];
  var id = setTimeout(function(){ if (NET === sess) fn(); }, ms);
  sess.timers.push(id);
  return id;
}
function netFail(sess, state, status){
  if (NET !== sess) return;
  netCloseTransport(); NET = null;
  LOBBY.state = state; LOBBY.status = status;
}
function netCloseTransport(){
  if (!NET) return;
  netClearTimers(NET);
  if (NET.transport){ try { NET.transport.close(); } catch(e){} NET.transport = null; }
  if (NET.conn){ try { NET.conn.close(); } catch(e){} NET.conn = null; }
  if (NET.peer){ try { NET.peer.destroy(); } catch(e){} NET.peer = null; }
  if (NET.bc){ try { NET.bc.close(); } catch(e){} NET.bc = null; }
}

// ----- session setup: host -----
function netHostStart(){
  NET = newNetSession("host");
  var sess = NET;
  NET.code = netGenCode();
  LOBBY.code = NET.code;
  LOBBY.state = "hostWait"; LOBBY.status = "① 開房中（連緊信令服務）…";
  if (QS_NETTEST){
    netAttachBC(sess);
    LOBBY.status = "等朋友入房…（本機測試模式）";
    return;
  }
  if (!peerAvailable()){
    LOBBY.state = "menu"; LOBBY.status = "連線組件載入失敗，線上雙打用唔到（本地模式不受影響）";
    NET = null;
    return;
  }
  netPeerHostOpen(sess);
}
function netHostConnReset(sess, conn){
  // a guest's direct connection died before the game started: drop that
  // conn only and keep the room open for another attempt
  if (NET !== sess || sess.active) return;
  if (sess.conn !== conn) return;
  sess.conn = null; sess.transport = null;
  try { conn.close(); } catch(e){}
  LOBBY.status = "頭先嗰個直連失敗咗，繼續等朋友入房…";
}
function netPeerHostOpen(sess){
  netClearTimers(sess);
  if (sess.peer){ try { sess.peer.destroy(); } catch(e){} sess.peer = null; }
  var peer;
  try { peer = new window.Peer(PEER_PREFIX + sess.code); } catch(e){
    LOBBY.state = "menu"; LOBBY.status = "開房失敗，再試下"; netCloseTransport(); NET = null; return;
  }
  sess.peer = peer;
  netArmTimer(sess, 12000, function(){
    netFail(sess, "menu", "開房失敗：連唔到信令服務（等咗 12 秒）— 檢查網絡；要用 Chrome/Safari 開，唔好喺通訊 app 入面開");
  });
  peer.on("open", function(){
    if (NET !== sess) return;
    netClearTimers(sess);
    if (!sess.active) LOBBY.status = "等朋友入房…";
  });
  peer.on("disconnected", function(){
    if (NET !== sess || sess.active) return;
    LOBBY.status = "信令斷咗，重連中…";
    try { peer.reconnect(); } catch(e){}
    netArmTimer(sess, 10000, function(){
      netFail(sess, "menu", "開房失敗：信令重連唔到 — 檢查網絡再試");
    });
  });
  peer.on("connection", function(conn){
    if (NET !== sess) return;
    if (sess.conn){ try { conn.close(); } catch(e){} return; }
    sess.conn = conn;
    netPeerTransport(sess, conn);
    LOBBY.status = "有朋友連緊入嚟…";
    conn.on("data", function(d){ if (sess.transport) sess.transport.onmessage(d); });
    conn.on("close", function(){ netPeerGone(); });
    conn.on("error", function(){ netHostConnReset(sess, conn); });
    conn.on("iceStateChanged", function(st){ if (st === "failed") netHostConnReset(sess, conn); });
  });
  peer.on("error", function(err){
    if (NET !== sess) return;
    var t = (err && err.type) ? err.type : "";
    if (t === "unavailable-id" && ++sess.retry <= 3){
      sess.code = netGenCode(); LOBBY.code = sess.code;
      netPeerHostOpen(sess);
    } else {
      LOBBY.state = "menu"; LOBBY.status = "開房失敗（" + t + "），再試下";
      netCloseTransport(); NET = null;
    }
  });
}

// ----- session setup: guest -----
function netGuestJoin(){
  var code = (LOBBY.typed || "").toUpperCase();
  if (code.length !== 6){ LOBBY.status = "代碼要 6 個字"; return; }
  NET = newNetSession("guest");
  var sess = NET;
  sess.code = code; LOBBY.code = code;
  LOBBY.state = "joining"; LOBBY.status = "① 連緊信令服務…";
  if (QS_NETTEST){
    netAttachBC(sess);
    sess.transport.send({ type: "hello", code: code });
    LOBBY.status = "等主機回應…（本機測試模式）";
    return;
  }
  if (!peerAvailable()){
    LOBBY.state = "menu"; LOBBY.status = "連線組件載入失敗，線上雙打用唔到（本地模式不受影響）";
    NET = null;
    return;
  }
  var peer;
  try { peer = new window.Peer(); } catch(e){
    LOBBY.state = "menu"; LOBBY.status = "連接失敗，再試下"; NET = null; return;
  }
  sess.peer = peer;
  netArmTimer(sess, 12000, function(){
    netFail(sess, "menu", "連唔到信令服務（等咗 12 秒）— 檢查網絡；要用 Chrome/Safari 開，唔好喺通訊 app 入面開");
  });
  peer.on("open", function(){
    if (NET !== sess) return;
    netClearTimers(sess);
    LOBBY.status = "② 信令 OK，直連緊主機…";
    var conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    sess.conn = conn;
    netPeerTransport(sess, conn);
    netArmTimer(sess, 20000, function(){
      netFail(sess, "typing", "直連唔到主機（等咗 20 秒）— 多數係網絡擋住咗直連：兩部機試下用同一個 WiFi，兩邊螢幕保持開住、停留喺遊戲畫面再試");
    });
    conn.on("open", function(){
      if (NET !== sess) return;
      netClearTimers(sess);
      sess.transport.send({ type: "hello", code: code });
      LOBBY.status = "③ 已連通，等主機開始…";
      netArmTimer(sess, 10000, function(){
        netFail(sess, "typing", "主機冇回應 — 等主機嗰邊重新開房再試");
      });
    });
    conn.on("data", function(d){ if (sess.transport) sess.transport.onmessage(d); });
    conn.on("close", function(){ netPeerGone(); });
    conn.on("error", function(err){
      var t = (err && err.type) ? err.type : "";
      netFail(sess, "typing", "直連失敗（" + t + "）— 兩部機試下用同一個 WiFi 再試");
    });
    conn.on("iceStateChanged", function(st){
      if (st === "failed") netFail(sess, "typing", "直連失敗（網絡擋住咗）— 兩部機試下用同一個 WiFi，兩邊螢幕保持開住再試");
    });
  });
  peer.on("disconnected", function(){
    if (NET !== sess || sess.active) return;
    netFail(sess, "menu", "信令斷咗線 — 檢查網絡再試");
  });
  peer.on("error", function(err){
    if (NET !== sess) return;
    var t = (err && err.type) ? err.type : "";
    if (t === "peer-unavailable") netFail(sess, "typing", "房間唔存在，檢查代碼再試");
    else netFail(sess, "menu", "連接失敗（" + t + "），再試下");
  });
}

// ----- message handling / game start -----
function netHandleMessage(msg){
  if (!NET || !msg || !msg.type) return;
  if (msg.type === "hello"){
    if (NET.role !== "host" || NET.active || LOBBY.state !== "hostWait") return;
    if (msg.code && msg.code !== NET.code){
      NET.transport.send({ type: "reject" });
      return;
    }
    netHostBegin();
  }
  else if (msg.type === "reject"){
    if (NET.role === "guest" && LOBBY.state === "joining"){
      netCloseTransport(); NET = null;
      LOBBY.state = "typing"; LOBBY.status = "代碼唔啱，再輸入過";
    }
  }
  else if (msg.type === "start"){
    if (NET.role === "guest" && !NET.active && typeof msg.seed === "number") netStartGame(msg.seed);
  }

// ----- lockstep core -----
// Once per rendered frame: stamp the local live channel into records for
// upcoming ticks and send them. Presses are read-and-cleared from the live
// edgeBuf exactly once, onto the first record produced this frame.

  while (NET.nextTick <= target){
    var rec = { t: NET.nextTick,
      l: { up: !!input.up, down: !!input.down, left: !!input.left, right: !!input.right },
      p: { punch: first && capP, kick: first && capK, jump: first && capJ } };
    NET.recs[NET.myIdx][rec.t] = rec;
    NET.transport.send({ type: "input", rec: rec });

    var pin = stagePins[idx] || (stagePins[idx] = makeStagePin());
    pin.lv.up = !!rec.l.up; pin.lv.down = !!rec.l.down;
    pin.lv.left = !!rec.l.left; pin.lv.right = !!rec.l.right;
    if (rec.p.punch) pin.buf.punch = BUF_TICKS;

// ---------- responsive canvas ----------

// ---------- main loop: fixed timestep, decoupled render ----------
var fixedSeed = 20261110;      // run seed; __game.start(seed) / UI restart use it unless changed
G = newGame(fixedSeed);
selApply();
var acc = 0, lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);

  var dtMs = ts - lastTs; lastTs = ts;

  // level first appears (holding never re-arms; releasing clears the level)
  if (input.punch && !frame._pWas) edgeBuf.punch = BUF_TICKS;
  if (input.kick && !frame._kWas) edgeBuf.kick = BUF_TICKS;
  if (input.jump && !frame._jWas){
    // a jump tap can complete inside a single rendered frame at low fps
    // (the button's pointerup may even reach the sim via stepTicks before
    // any frame() runs) — honour the direct pressEdge from the input layer
    // and only top the buffer up here for keyboard-style holds.
    if (edgeBuf.jump <= 0) edgeBuf.jump = BUF_TICKS;
  }
  frame._pWas = !!input.punch; frame._kWas = !!input.kick; frame._jWas = !!input.jump;
  pressTrack();
  if (NET && NET.active) netSample();

    // action edges are derived from edgeBuf inside simStep (buffered,
    // consumed by playerStep) — nothing to clear here.
    if (botOn && (G.phase === "fight" || G.phase === "go")){ botDrive(); }
    if (NET && NET.active && (G.phase === "fight" || G.phase === "go")){
      // lockstep gate: never step a tick until BOTH players' records for
      // it are held. Stall instead (and drop the frame's time debt, so a
      // slow peer cannot build up a catch-up burst).
      if (!netCanStep()){
        NET.stallFrames++;

        acc = 0;
        break;

      netApplyTick(G.tick);

  shakeY = G.shake > 0 ? ((G.tick * 104729) % 5 - 2) * (G.shake / 3) : 0;

  forceWave: function(n){ G.enemies = []; G.bossRef = null; startWave(n); },
  hurtPlayer: function(n, idx){ var q = G.players[idx || 0]; q.hp -= n; if (q.hp <= 0 && !q.dead){ q.dead = true; q.state = "down"; q.tState = 0; q.vy = 200; } },
  killPlayer: function(idx){ var q = G.players[idx || 0]; q.hp = 0; q.dead = true; q.state = "down"; q.tState = 0.9; q.removeMe = false; },
  spawnBoss: function(){ G.enemies = []; G.bossRef = null; startWave(3); },
  killAll: function(){ for (var i=0;i<G.enemies.length;i++){ G.enemies[i].hp = 0; G.enemies[i].dead = true; G.enemies[i].state = "down"; G.enemies[i].tState = 0.79; G.enemies[i].vy = 1; G.enemies[i].y = 0.01; } },
  giveWeapon: function(t, idx){ G.players[idx || 0].weapon = { type: t || "bat", dur: 8 }; },
  setInput: function(o, idx){ pinForTest(idx || 0).set(o); },
  botStep: function(idx, mode){
    // legacy: one interleaved sim step driven by the shared botDrive logic
    // (P1 only; mode "stand" parks the bot)
    if ((idx || 0) === 0 && mode !== "stand") botDrive();
    else if (mode === "stand") pinForTest(idx || 0).set({ up:false, down:false, left:false, right:false });
    simStep(STEP);
    input.startP = false;
  },
  stepTicks: function(n){ for (var i=0;i<n;i++){ simStep(STEP); input.startP = false; } },
  useBot: function(on){ botOn = !!on; },
  // deterministic wave-1 bot run (same logic the browser build uses via
  // botDrive): returns the snapshot when wave 1 ends (cleared or died).
  botWave1: function(seed, opts){
    fixedSeed = seed;
    G = newGame(seed, defaultCfg(opts)); G.phase = "fight"; startWave(0);
    resetInputState();
    var guard = 0;
    while (guard++ < 60 * 120){
      if (G.phase === "go" || G.phase === "over" || G.wave > 0) break;
      botDrive();
      simStep(STEP); input.startP = false;
    }
    var snap = this.snapshot();
    resetInputState();
    return snap;
  },
  snapshot: function(){
    var ps = [];
    for (var i=0;i<G.players.length;i++){
      var q = G.players[i];
      ps.push({ hp: q.hp, x: Math.round(q.x), z: Math.round(q.z), state: q.state,
        charId: q.charId, kind: q.kind, alive: !q.dead,
        weapon: q.weapon ? q.weapon.type : null });
    }
    return {
      phase: G.phase, wave: G.wave, score: G.score,
      mode: G.mode, players: ps,
      playerHp: ps[0].hp, playerX: ps[0].x, playerZ: ps[0].z,
      playerState: ps[0].state, weapon: ps[0].weapon,
      enemiesAlive: G.enemies.filter(function(e){ return !e.removeMe; }).length,
      propsLeft: G.props.filter(function(pr){ return !pr.dead; }).length,
      foodOut: G.parts.filter(function(q2){ return q2.food; }).length,
      cam: Math.round(G.cam), tick: G.tick, time: Math.round(G.time * 10) / 10,
      bossHp: G.bossRef ? G.bossRef.hp : null
    };
  }
};
</script>
